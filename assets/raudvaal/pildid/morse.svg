<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
  <title id="t">Morse ei ole salakiri</title>
  <desc id="d">Kaks etappi. Esimene: morsemärgid kirjutatakse tähtedeks, näiteks punktid ja kriipsud annavad sõna WIDAR; seda oskab radist ka sisu teadmata. Teine: kokkulepitud märgirühma tähendus leitakse kooditabelist; ilma tabelita jääb rühm arusaamatuks. Märgirühm ja tabel on välja mõeldud näide.</desc>
  <rect width="760" height="360" fill="#f4ead2"/>
  <g font-family="Georgia, serif" fill="#2b1d10">
    <text x="20" y="30" font-size="15">1. Kuulata ja üles kirjutada: märgid → tähed</text>
    <text x="20" y="200" font-size="15">2. Aru saada: märgirühm → kooditabel → tähendus</text>
  </g>
  <!-- W I D A R -->
  <g fill="#1f4e79">
    <!-- W -->
    <circle cx="40" cy="70" r="6"/><rect x="54" y="64" width="30" height="12" rx="4"/><rect x="92" y="64" width="30" height="12" rx="4"/>
    <!-- I -->
    <circle cx="170" cy="70" r="6"/><circle cx="190" cy="70" r="6"/>
    <!-- D -->
    <rect x="240" y="64" width="30" height="12" rx="4"/><circle cx="284" cy="70" r="6"/><circle cx="304" cy="70" r="6"/>
    <!-- A -->
    <circle cx="354" cy="70" r="6"/><rect x="368" y="64" width="30" height="12" rx="4"/>
    <!-- R -->
    <circle cx="446" cy="70" r="6"/><rect x="460" y="64" width="30" height="12" rx="4"/><circle cx="504" cy="70" r="6"/>
  </g>
  <g font-family="Georgia, serif" font-size="24" fill="#2b1d10" text-anchor="middle">
    <text x="81" y="118">W</text><text x="180" y="118">I</text><text x="272" y="118">D</text><text x="376" y="118">A</text><text x="475" y="118">R</text>
  </g>
  <g font-family="Georgia, serif" font-size="12" fill="#5a3f16" text-anchor="middle">
    <text x="81" y="138">· — —</text><text x="180" y="138">· ·</text><text x="272" y="138">— · ·</text><text x="376" y="138">· —</text><text x="475" y="138">· — ·</text>
  </g>
  <rect x="32" y="56" width="98" height="28" fill="none" stroke="#8a1c1c" stroke-width="2" rx="5">
    <animate attributeName="x" values="32;160;232;346;438;32" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="width" values="98;42;80;60;74;98" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
  </rect>
  <g font-family="Georgia, serif" font-size="12" fill="#2b1d10">
    <text x="560" y="64">punkt = lühike toon</text>
    <text x="560" y="84">kriips = kolm korda pikem</text>
    <text x="560" y="104">radist kirjutab tähed üles</text>
    <text x="560" y="124">ka siis, kui sisu jääb talle</text>
    <text x="560" y="144">veel võõraks</text>
  </g>
  <!-- etapp 2 -->
  <rect x="30" y="222" width="150" height="54" rx="6" fill="#fbf5e6" stroke="#5a3f16"/>
  <text x="105" y="256" font-family="Georgia, serif" font-size="22" fill="#2b1d10" text-anchor="middle" letter-spacing="4">QXKF</text>
  <path d="M190 249 H260" stroke="#2b1d10" stroke-width="2"/><path d="M260 249 l-10 -6 v12z" fill="#2b1d10"/>
  <rect x="270" y="214" width="230" height="110" fill="#fbf5e6" stroke="#5a3f16"/>
  <g font-family="Georgia, serif" font-size="13" fill="#2b1d10">
    <text x="282" y="234" font-style="italic" fill="#5a3f16">kooditabel</text>
    <line x1="282" y1="240" x2="488" y2="240" stroke="#5a3f16"/>
    <text x="282" y="260">QXKD   varustus</text>
    <text x="282" y="282" fill="#8a1c1c">QXKF   kohtumispunkt</text>
    <text x="282" y="304">QXKG   ootama</text>
  </g>
  <rect x="277" y="268" width="200" height="20" fill="none" stroke="#8a1c1c" stroke-width="2" rx="3"/>
  <path d="M510 278 H570" stroke="#2b1d10" stroke-width="2"/><path d="M570 278 l-10 -6 v12z" fill="#2b1d10"/>
  <text x="580" y="284" font-family="Georgia, serif" font-size="16" fill="#8a1c1c">„kohtumispunkt”</text>
  <text x="20" y="348" font-family="Georgia, serif" font-size="11" fill="#5a3f16">Salajasus tuleb kodeerimisest või šifreerimisest, mitte morsest. Märgirühm ja tabel on välja mõeldud näide; heli on sünteesitud õppenäide.</text>
</svg>
