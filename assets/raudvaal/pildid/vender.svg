<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
  <title id="t">Köiest vender</title>
  <desc id="d">Vasakul jämedast köiest punutud piklik vender, otstes aasad riputamiseks. Paremal eestvaade kahest kõrvuti lainetes liikuvast paadist: vender surutakse kerede vahel kokku, kinnitusotsad piiravad nihkumist, kuid paadid liiguvad eraldi edasi.</desc>
  <defs>
    <pattern id="punutis" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#c9a86a"/>
      <path d="M0 16 L8 0 M8 16 L16 0" stroke="#8a6a3a" stroke-width="3"/>
      <path d="M0 0 L8 16 M8 0 L16 16" stroke="#e2c894" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="760" height="360" fill="#f4ead2"/>
  <g font-family="Georgia, serif" fill="#2b1d10">
    <text x="20" y="28" font-size="15">1. Punutud vender</text>
    <text x="360" y="28" font-size="15">2. Kahe paadi vahel (eestvaade)</text>
  </g>
  <!-- vender -->
  <path d="M170 50 q-18 0 -18 -14 q0 -12 18 -12 q18 0 18 12 q0 14 -18 14z" fill="none" stroke="#8a6a3a" stroke-width="5"/>
  <rect x="130" y="56" width="80" height="200" rx="38" fill="url(#punutis)" stroke="#6b4e1a" stroke-width="2"/>
  <path d="M170 262 q-18 0 -18 14 q0 12 18 12 q18 0 18 -12 q0 -14 -18 -14z" fill="none" stroke="#8a6a3a" stroke-width="5"/>
  <g font-family="Georgia, serif" font-size="12" fill="#2b1d10">
    <text x="196" y="40">aas riputamiseks</text>
    <text x="220" y="160">jäme köis,</text>
    <text x="220" y="176">tihedalt punutud</text>
  </g>
  <!-- kaks paati -->
  <rect x="360" y="190" width="380" height="120" fill="#cfe0ee"/>
  <path d="M360 190 q24 -8 48 0 t48 0 t48 0 t48 0 t48 0 t48 0 t48 0 t44 0" fill="none" stroke="#1f4e79" stroke-width="2"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 470 200; 3 470 200; -3 470 200" dur="4s" repeatCount="indefinite"/>
    <path d="M400 150 H520 V200 Q520 262 460 262 Q400 262 400 200Z" fill="#4a4a4a"/>
    <rect x="440" y="118" width="34" height="32" fill="#4a4a4a"/>
    <text x="460" y="112" font-family="Georgia, serif" font-size="12" fill="#2b1d10" text-anchor="middle">U-398</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="2 640 200; -2 640 200; 2 640 200" dur="4.6s" repeatCount="indefinite"/>
    <path d="M556 140 H728 V200 Q728 276 642 276 Q556 276 556 200Z" fill="#3c3c3c"/>
    <rect x="620" y="104" width="40" height="36" fill="#3c3c3c"/>
    <text x="640" y="98" font-family="Georgia, serif" font-size="12" fill="#2b1d10" text-anchor="middle">Widar</text>
  </g>
  <rect x="522" y="176" width="32" height="44" rx="14" fill="url(#punutis)" stroke="#6b4e1a" stroke-width="1.5">
    <animate attributeName="width" values="32;22;32" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x" values="522;527;522" dur="2s" repeatCount="indefinite"/>
  </rect>
  <path d="M500 152 Q538 136 580 144" fill="none" stroke="#8a6a1c" stroke-width="2.5"/>
  <g font-family="Georgia, serif" font-size="12" fill="#2b1d10">
    <text x="470" y="330">vender võtab löögi vastu,</text>
    <text x="470" y="346">kinnitusotsad piiravad nihkumist</text>
    <text x="364" y="60" fill="#5a3f16">paadid ei muutu üheks tervikuks:</text>
    <text x="364" y="76" fill="#5a3f16">mõlemad liiguvad lainetes eraldi</text>
  </g>
  <text x="20" y="346" font-family="Georgia, serif" font-size="11" fill="#5a3f16">Selgitav joonis, mitte kindla paadi varustus.</text>
</svg>
