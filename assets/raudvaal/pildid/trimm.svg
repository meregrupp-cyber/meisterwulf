<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
  <title id="t">Kuidas lasti kaal laeva asendist välja arvutada</title>
  <desc id="d">Animeeritud põhimõtteskeem külgvaates. Ahtrisse lisatud raskus paneb paadi ahtrist vajuma; kui sama raskus tõstetakse keskosa poole, väheneb kalle, sest raskuse kaugus tasakaalupunktist on väiksem. All: vee liigutamine vööri ja ahtri trimmitankide vahel. Põhimõtteskeem, mitte Widari andmed.</desc>
  <defs>
    <clipPath id="meri"><rect x="0" y="150" width="760" height="120"/></clipPath>
  </defs>
  <rect width="760" height="420" fill="#f4ead2"/>
  <text x="20" y="28" font-family="Georgia, serif" font-size="15" fill="#2b1d10">1. Sama raskus, eri koht: kalle muutub</text>
  <rect x="0" y="150" width="760" height="120" fill="#cfe0ee"/>
  <line x1="0" y1="150" x2="760" y2="150" stroke="#1f4e79" stroke-width="2"/>
  <text x="740" y="144" font-family="Georgia, serif" font-size="11" fill="#1f4e79" text-anchor="end">veeliin</text>
  <!-- paat, mis kaldub -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 380 150; -3 380 150; -3 380 150; -1 380 150; -1 380 150; 0 380 150" keyTimes="0; 0.15; 0.4; 0.55; 0.85; 1" dur="10s" repeatCount="indefinite"/>
    <path d="M110 150 C130 128 170 124 220 124 H560 C610 124 640 132 660 150 C640 170 610 176 560 176 H220 C170 176 130 172 110 150Z" fill="#4a4a4a"/>
    <rect x="360" y="96" width="54" height="30" rx="4" fill="#4a4a4a"/>
    <text x="630" y="118" font-family="Georgia, serif" font-size="12" fill="#2b1d10">vöör</text>
    <text x="100" y="118" font-family="Georgia, serif" font-size="12" fill="#2b1d10">ahter</text>
    <line x1="385" y1="130" x2="385" y2="176" stroke="#f4ead2" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- raskus -->
    <rect x="150" y="134" width="40" height="28" fill="#c9a227" stroke="#6b5410" stroke-width="1.5">
      <animate attributeName="x" values="150;150;150;300;300;150" keyTimes="0; 0.15; 0.4; 0.55; 0.85; 1" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0; 0.1; 0.4; 0.55; 0.9; 1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <line x1="170" y1="190" x2="385" y2="190" stroke="#8a1c1c" stroke-width="2">
      <animate attributeName="x1" values="170;170;170;320;320;170" keyTimes="0; 0.15; 0.4; 0.55; 0.85; 1" dur="10s" repeatCount="indefinite"/>
    </line>
  </g>
  <g font-family="Georgia, serif" font-size="12" fill="#8a1c1c">
    <text x="190" y="214">raskuse kaugus tasakaalupunktist (moment = kaal × õlg)
      <animate attributeName="x" values="190;190;190;300;300;190" keyTimes="0; 0.15; 0.4; 0.55; 0.85; 1" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="385" y="246" font-family="Georgia, serif" font-size="11" fill="#1f4e79" text-anchor="middle">tasakaalupunkt</text>
  <!-- trimmitankid -->
  <text x="20" y="300" font-family="Georgia, serif" font-size="15" fill="#2b1d10">2. Tasakaalu seadmine: vesi liigub trimmitankide vahel</text>
  <rect x="80" y="320" width="120" height="50" rx="6" fill="#fbf5e6" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="560" y="320" width="120" height="50" rx="6" fill="#fbf5e6" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="82" y="346" width="116" height="22" fill="#6fa0c8">
    <animate attributeName="height" values="22;22;10;10;22" keyTimes="0;0.5;0.7;0.9;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y" values="346;346;358;358;346" keyTimes="0;0.5;0.7;0.9;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect x="562" y="346" width="116" height="22" fill="#6fa0c8">
    <animate attributeName="height" values="22;22;34;34;22" keyTimes="0;0.5;0.7;0.9;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y" values="346;346;334;334;346" keyTimes="0;0.5;0.7;0.9;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <path d="M200 345 H560" stroke="#4a4a4a" stroke-width="4" fill="none"/>
  <path d="M540 339 l14 6 -14 6z" fill="#1f4e79"/>
  <g font-family="Georgia, serif" font-size="12" fill="#2b1d10">
    <text x="140" y="390" text-anchor="middle">ahtri trimmitank</text>
    <text x="620" y="390" text-anchor="middle">vööri trimmitank</text>
    <text x="380" y="330" text-anchor="middle">vesi pumbatakse ahtrist vööri</text>
  </g>
  <text x="740" y="412" font-family="Georgia, serif" font-size="11" fill="#5a3f16" text-anchor="end">Põhimõtteskeem: kalded on liialdatud, Widari tehaseandmeid see ei esita.</text>
</svg>
