<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-labelledby="t d">
  <title id="t">Kuidas allveelaev põhjast lahti sai</title>
  <desc id="d">Kolm läbilõiget samast paadist: põhjas lebamine, vee vähendamine tasakaalupaagis koos meeste ümberpaiknemisega ja põhjast vabanemine.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#8a1c1c"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1f4e79"/></marker>
    <symbol id="paat" viewBox="-110 -30 220 60">
      <path d="M-100 0 Q-95 -14 -60 -16 L60 -16 Q95 -14 100 0 Q95 14 60 16 L-60 16 Q-95 14 -100 0z" fill="#2b1d10"/>
      <rect x="-14" y="-32" width="28" height="18" rx="3" fill="#2b1d10"/>
    </symbol>
    <symbol id="mees" viewBox="0 0 10 20"><circle cx="5" cy="3" r="3" fill="#e8c97a"/><path d="M5 6v8M1 9l4-3 4 3M2 19l3-5 3 5" stroke="#e8c97a" stroke-width="2" fill="none"/></symbol>
  </defs>
  <rect width="780" height="330" fill="#f4ead2"/>
  <!-- kolm paneeli -->
  <g font-family="Georgia, serif" fill="#2b1d10">
    <text x="130" y="28" font-size="17" text-anchor="middle">1. Põhjas</text>
    <text x="390" y="28" font-size="17" text-anchor="middle">2. Vett vähemaks, mehed liiguvad</text>
    <text x="650" y="28" font-size="17" text-anchor="middle">3. Vaba</text>
  </g>
  <!-- vesi ja põhi igas paneelis -->
  <g>
    <rect x="10" y="40" width="240" height="230" fill="#cfe0ee"/>
    <rect x="270" y="40" width="240" height="230" fill="#cfe0ee"/>
    <rect x="530" y="40" width="240" height="230" fill="#cfe0ee"/>
    <path d="M10 236 q30-6 60 0 t60 0 t60 0 t60 0 V270 H10z" fill="#b59a5c"/>
    <path d="M270 236 q30-6 60 0 t60 0 t60 0 t60 0 V270 H270z" fill="#b59a5c"/>
    <path d="M530 236 q30-6 60 0 t60 0 t60 0 t60 0 V270 H530z" fill="#b59a5c"/>
  </g>
  <!-- 1: põhjas -->
  <use href="#paat" x="20" y="190" width="220" height="60"/>
  <rect x="112" y="212" width="36" height="14" fill="#1f4e79" stroke="#e8c97a" stroke-width="1"/>
  <text x="130" y="258" font-family="Georgia, serif" font-size="12" fill="#2b1d10" text-anchor="middle">tasakaalupaak täis</text>
  <use href="#mees" x="60" y="196" width="8" height="16"/><use href="#mees" x="74" y="196" width="8" height="16"/><use href="#mees" x="88" y="196" width="8" height="16"/>
  <use href="#mees" x="160" y="196" width="8" height="16"/><use href="#mees" x="174" y="196" width="8" height="16"/>
  <text x="130" y="120" font-family="Georgia, serif" font-size="13" fill="#5a3f16" text-anchor="middle">paat on veidi raskem</text>
  <text x="130" y="138" font-family="Georgia, serif" font-size="13" fill="#5a3f16" text-anchor="middle">kui väljatõrjutud vesi</text>
  <!-- 2: vett vähemaks, mehed ahtrisse, kalle -->
  <g transform="rotate(-6 390 220)">
    <use href="#paat" x="280" y="190" width="220" height="60"/>
    <rect x="372" y="212" width="36" height="14" fill="none" stroke="#e8c97a" stroke-width="1"/>
    <rect x="372" y="219" width="36" height="7" fill="#1f4e79"/>
    <use href="#mees" x="420" y="196" width="8" height="16"/><use href="#mees" x="434" y="196" width="8" height="16"/><use href="#mees" x="448" y="196" width="8" height="16"/><use href="#mees" x="462" y="196" width="8" height="16"/><use href="#mees" x="406" y="196" width="8" height="16"/>
  </g>
  <line x1="330" y1="170" x2="440" y2="170" stroke="#8a1c1c" stroke-width="2.5" marker-end="url(#a1)"/>
  <text x="385" y="162" font-family="Georgia, serif" font-size="12" fill="#8a1c1c" text-anchor="middle">mehed vöörist ahtrisse</text>
  <text x="390" y="258" font-family="Georgia, serif" font-size="12" fill="#2b1d10" text-anchor="middle">paagist vett välja</text>
  <text x="390" y="110" font-family="Georgia, serif" font-size="13" fill="#5a3f16" text-anchor="middle">kalle muutub, üks ots</text>
  <text x="390" y="128" font-family="Georgia, serif" font-size="13" fill="#5a3f16" text-anchor="middle">tuleb esimesena lahti</text>
  <!-- 3: vaba -->
  <use href="#paat" x="540" y="120" width="220" height="60"/>
  <rect x="632" y="142" width="36" height="14" fill="none" stroke="#e8c97a" stroke-width="1"/>
  <rect x="632" y="151" width="36" height="5" fill="#1f4e79"/>
  <use href="#mees" x="600" y="126" width="8" height="16"/><use href="#mees" x="614" y="126" width="8" height="16"/><use href="#mees" x="676" y="126" width="8" height="16"/><use href="#mees" x="690" y="126" width="8" height="16"/>
  <line x1="650" y1="225" x2="650" y2="185" stroke="#1f4e79" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="650" y="258" font-family="Georgia, serif" font-size="12" fill="#2b1d10" text-anchor="middle">paat tõuseb elektrimootoritega edasi</text>
  <text x="650" y="76" font-family="Georgia, serif" font-size="13" fill="#5a3f16" text-anchor="middle">tankide puhumine suruõhuga</text>
  <text x="650" y="94" font-family="Georgia, serif" font-size="13" fill="#5a3f16" text-anchor="middle">jääb viimaseks: mullid reedavad</text>
  <text x="20" y="300" font-family="Georgia, serif" font-size="14" fill="#5a3f16">Skeem 1943. aasta Saksa sukeldumiseeskirja (§ 231–239) kirjelduse järgi; mõõtkava ja kalle on liialdatud.</text>
  <text x="20" y="320" font-family="Georgia, serif" font-size="14" fill="#5a3f16">Joonis: meisterwulf.com.</text>
</svg>
