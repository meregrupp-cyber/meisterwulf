<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
  <title id="t">Neli tonni, kuid kõigest tünnitäis metalli</title>
  <desc id="d">Vasakul umbes 12,5-kilone kullakang ja liitrine mõõdunõu, kuhu mahuks kangi metall ligikaudu 0,65 liitri kõrguseni. Paremal neli tonni kulda: metalli ruumala umbes 207 liitrit ehk veidi üle tavalise 200-liitrise vaadi, kõrval kaheksakümmend pakitud kasti. Ruumalad on ligikaudsed ja näitavad ainult metalli, mitte pakendit.</desc>
  <rect width="760" height="380" fill="#f4ead2"/>
  <g font-family="Georgia, serif" fill="#2b1d10">
    <text x="20" y="28" font-size="15">1. Üks kang: raske, kuid väike</text>
    <text x="330" y="28" font-size="15">2. Neli tonni: metall ja pakend</text>
  </g>
  <!-- kang -->
  <path d="M40 190 l20 -30 h110 l20 30z" fill="#d4af37" stroke="#8a6d10" stroke-width="2"/>
  <path d="M60 160 h110 l-8 -6 h-94z" fill="#e8c95a" stroke="#8a6d10"/>
  <text x="115" y="216" font-family="Georgia, serif" font-size="13" fill="#2b1d10" text-anchor="middle">≈ 12,5 kg</text>
  <!-- mõõdunõu -->
  <path d="M220 90 h70 v140 h-70z" fill="#fbf5e6" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="222" y="139" width="66" height="89" fill="#d4af37" opacity="0.75"/>
  <line x1="220" y1="90" x2="290" y2="90" stroke="#4a4a4a"/>
  <g font-family="Georgia, serif" font-size="11" fill="#2b1d10">
    <line x1="290" y1="90" x2="300" y2="90" stroke="#4a4a4a"/><text x="304" y="94">1 l</text>
    <line x1="290" y1="139" x2="300" y2="139" stroke="#8a1c1c"/><text x="304" y="143" fill="#8a1c1c">0,65 l</text>
  </g>
  <text x="20" y="262" font-family="Georgia, serif" font-size="12" fill="#2b1d10">kulla tihedus ≈ 19,3 kg liitri kohta:</text>
  <text x="20" y="280" font-family="Georgia, serif" font-size="12" fill="#2b1d10">12,5 kg metalli mahub umbes 0,65 liitrisse</text>
  <!-- vaat -->
  <g transform="translate(360 70)">
    <rect x="0" y="0" width="110" height="160" rx="10" fill="#d4af37" stroke="#8a6d10" stroke-width="2"/>
    <line x1="0" y1="45" x2="110" y2="45" stroke="#8a6d10" stroke-width="2"/>
    <line x1="0" y1="115" x2="110" y2="115" stroke="#8a6d10" stroke-width="2"/>
    <text x="55" y="186" font-family="Georgia, serif" font-size="13" fill="#2b1d10" text-anchor="middle">≈ 207 l metalli</text>
    <text x="55" y="204" font-family="Georgia, serif" font-size="11" fill="#5a3f16" text-anchor="middle">veidi üle 200-liitrise vaadi</text>
  </g>
  <!-- 80 kasti -->
  <g transform="translate(528 64)" fill="#b08a55" stroke="#6b4e1a" stroke-width="1"><rect x="0" y="0" width="22" height="17"/><rect x="26" y="0" width="22" height="17"/><rect x="52" y="0" width="22" height="17"/><rect x="78" y="0" width="22" height="17"/><rect x="104" y="0" width="22" height="17"/><rect x="130" y="0" width="22" height="17"/><rect x="156" y="0" width="22" height="17"/><rect x="182" y="0" width="22" height="17"/><rect x="0" y="21" width="22" height="17"/><rect x="26" y="21" width="22" height="17"/><rect x="52" y="21" width="22" height="17"/><rect x="78" y="21" width="22" height="17"/><rect x="104" y="21" width="22" height="17"/><rect x="130" y="21" width="22" height="17"/><rect x="156" y="21" width="22" height="17"/><rect x="182" y="21" width="22" height="17"/><rect x="0" y="42" width="22" height="17"/><rect x="26" y="42" width="22" height="17"/><rect x="52" y="42" width="22" height="17"/><rect x="78" y="42" width="22" height="17"/><rect x="104" y="42" width="22" height="17"/><rect x="130" y="42" width="22" height="17"/><rect x="156" y="42" width="22" height="17"/><rect x="182" y="42" width="22" height="17"/><rect x="0" y="63" width="22" height="17"/><rect x="26" y="63" width="22" height="17"/><rect x="52" y="63" width="22" height="17"/><rect x="78" y="63" width="22" height="17"/><rect x="104" y="63" width="22" height="17"/><rect x="130" y="63" width="22" height="17"/><rect x="156" y="63" width="22" height="17"/><rect x="182" y="63" width="22" height="17"/><rect x="0" y="84" width="22" height="17"/><rect x="26" y="84" width="22" height="17"/><rect x="52" y="84" width="22" height="17"/><rect x="78" y="84" width="22" height="17"/><rect x="104" y="84" width="22" height="17"/><rect x="130" y="84" width="22" height="17"/><rect x="156" y="84" width="22" height="17"/><rect x="182" y="84" width="22" height="17"/><rect x="0" y="105" width="22" height="17"/><rect x="26" y="105" width="22" height="17"/><rect x="52" y="105" width="22" height="17"/><rect x="78" y="105" width="22" height="17"/><rect x="104" y="105" width="22" height="17"/><rect x="130" y="105" width="22" height="17"/><rect x="156" y="105" width="22" height="17"/><rect x="182" y="105" width="22" height="17"/><rect x="0" y="126" width="22" height="17"/><rect x="26" y="126" width="22" height="17"/><rect x="52" y="126" width="22" height="17"/><rect x="78" y="126" width="22" height="17"/><rect x="104" y="126" width="22" height="17"/><rect x="130" y="126" width="22" height="17"/><rect x="156" y="126" width="22" height="17"/><rect x="182" y="126" width="22" height="17"/><rect x="0" y="147" width="22" height="17"/><rect x="26" y="147" width="22" height="17"/><rect x="52" y="147" width="22" height="17"/><rect x="78" y="147" width="22" height="17"/><rect x="104" y="147" width="22" height="17"/><rect x="130" y="147" width="22" height="17"/><rect x="156" y="147" width="22" height="17"/><rect x="182" y="147" width="22" height="17"/><rect x="0" y="168" width="22" height="17"/><rect x="26" y="168" width="22" height="17"/><rect x="52" y="168" width="22" height="17"/><rect x="78" y="168" width="22" height="17"/><rect x="104" y="168" width="22" height="17"/><rect x="130" y="168" width="22" height="17"/><rect x="156" y="168" width="22" height="17"/><rect x="182" y="168" width="22" height="17"/><rect x="0" y="189" width="22" height="17"/><rect x="26" y="189" width="22" height="17"/><rect x="52" y="189" width="22" height="17"/><rect x="78" y="189" width="22" height="17"/><rect x="104" y="189" width="22" height="17"/><rect x="130" y="189" width="22" height="17"/><rect x="156" y="189" width="22" height="17"/><rect x="182" y="189" width="22" height="17"/></g>
  <text x="630" y="300" font-family="Georgia, serif" font-size="13" fill="#2b1d10" text-anchor="middle">80 kasti, igas 4 kangi</text>
  <text x="630" y="318" font-family="Georgia, serif" font-size="11" fill="#5a3f16" text-anchor="middle">puit, pakend ja vahed võtavad</text>
  <text x="630" y="334" font-family="Georgia, serif" font-size="11" fill="#5a3f16" text-anchor="middle">mitu korda rohkem ruumi</text>
  <text x="20" y="366" font-family="Georgia, serif" font-size="11" fill="#5a3f16">Ligikaudsed arvutused kulla tiheduse ja Bundesbanki näidiskangi kaalu põhjal; pildid näitavad ainult metalli ruumala.</text>
</svg>
