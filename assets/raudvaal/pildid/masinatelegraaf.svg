  <g font-family="Georgia, serif" fill="#2b1d10" font-size="13">
    <text x="585" y="120">1. Sild keerab käepideme</text><text x="585" y="137">soovitud käigule;</text><text x="585" y="154">masinaruumis heliseb.</text>
    <text x="585" y="190">2. Masinamees seab oma</text><text x="585" y="207">osuti samale kohale:</text><text x="585" y="224">käsk on kätte saadud.</text>
    <text x="585" y="260">3. Mootorit juhib</text><text x="585" y="277">masinamees, mitte</text><text x="585" y="294">telegraaf.</text>
    <text x="585" y="330" fill="#1f4e79">Peatükis: vasak „seis“,</text><text x="585" y="347" fill="#1f4e79">parem „aeglaselt edasi“.</text>
  </g>
  <text x="20" y="440" font-family="Georgia, serif" font-size="13" fill="#8a1c1c">„Seis“ telegraafil on käsk seisata, mitte kindlustatud võll: vee all töötamiseks lahutatakse sidur</text>
  <text x="20" y="458" font-family="Georgia, serif" font-size="13" fill="#8a1c1c">ja keeratakse võllipidur kinni.</text>
  <text x="20" y="494" font-family="Georgia, serif" font-size="12" fill="#5a3f16">Põhimõtteskeem; VIIC paadil olid vasaku ja parema poole jaoks eraldi süsteemid, märguanne sumisti, kella või pasunana.</text>
  <text x="20" y="510" font-family="Georgia, serif" font-size="12" fill="#5a3f16">Joonis: meisterwulf.com, autori kirjelduse järgi.</text>
