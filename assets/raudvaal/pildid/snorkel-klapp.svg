<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
  <title id="t">Šnorkel ja kõrvadest tõmbav paat</title>
  <desc id="d">Animeeritud läbilõige: laine lööb šnorkli pea üle, õhuvõtuklapp sulgub, diislid võtavad õhku paadi seest ja siserõhk langeb, klapp avaneb ja rõhk taastub.</desc>
  <defs>
    <marker id="k1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1f4e79"/></marker>
    <marker id="k2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#8a1c1c"/></marker>
    <clipPath id="sea"><rect x="0" y="0" width="760" height="360"/></clipPath>
  </defs>
  <rect width="760" height="400" fill="#f4ead2"/>
  <!-- meri: pind laine kujul, mis liigub -->
  <g clip-path="url(#sea)">
    <path fill="#cfe0ee" d="M-200 120 q40-22 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 V360 H-200z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="160 0" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="14" y="26" font-family="Georgia, serif" font-size="14" fill="#2b1d10">õhk</text>
  <text x="14" y="150" font-family="Georgia, serif" font-size="14" fill="#1f4e79">meri</text>
  <!-- paadi kere (läbilõige) -->
  <path d="M120 300 Q140 220 300 216 L560 216 Q640 220 660 300 Q640 340 560 344 L300 344 Q140 340 120 300z" fill="#2b1d10"/>
  <path d="M136 300 Q154 232 300 228 L556 228 Q628 232 644 300 Q628 330 556 332 L300 332 Q154 328 136 300z" fill="#d9c393"/>
  <!-- torn ja šnorklimast -->
  <rect x="330" y="176" width="70" height="44" fill="#2b1d10"/>
  <rect x="406" y="70" width="14" height="150" fill="#5a3f16"/>
  <!-- šnorkli pea ja klapp -->
  <rect x="396" y="56" width="34" height="18" rx="4" fill="#5a3f16"/>
  <g id="klapp">
    <rect x="401" y="44" width="24" height="12" rx="3" fill="#8a1c1c">
      <animate attributeName="y" values="30;30;56;56;30;30" keyTimes="0;0.35;0.4;0.6;0.65;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="436" y="66" font-family="Georgia, serif" font-size="13" fill="#8a1c1c">õhuvõtuklapp</text>
  <!-- laine, mis lööb pea üle -->
  <path d="M340 90 q30-30 60 0 t60 0 t60 0" fill="#cfe0ee" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.4;0.6;0.67;1" dur="8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -40;0 -40;0 0;0 0" keyTimes="0;0.33;0.4;0.6;0.67;1" dur="8s" repeatCount="indefinite"/>
  </path>
  <!-- õhuvool masti mööda alla (avatud klapi ajal) -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.35;0.4;0.6;0.65;1" dur="8s" repeatCount="indefinite"/>
    <line x1="413" y1="80" x2="413" y2="200" stroke="#1f4e79" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#k1)">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1s" repeatCount="indefinite"/>
    </line>
    <text x="424" y="150" font-family="Georgia, serif" font-size="12" fill="#1f4e79">välisõhk diislitele</text>
  </g>
  <!-- diisel ahtris -->
  <rect x="500" y="262" width="60" height="44" rx="4" fill="#5a3f16"/>
  <text x="530" y="322" font-family="Georgia, serif" font-size="12" fill="#2b1d10" text-anchor="middle">diislid</text>
  <!-- mehed vööris ja tsentraalis -->
  <g fill="#e8c97a"><circle cx="200" cy="262" r="5"/><circle cx="230" cy="262" r="5"/><circle cx="260" cy="262" r="5"/><circle cx="360" cy="262" r="5"/></g>
  <!-- õhk paadi seest diislitesse (suletud klapi ajal) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.42;0.6;0.65;1" dur="8s" repeatCount="indefinite"/>
    <line x1="200" y1="286" x2="490" y2="286" stroke="#8a1c1c" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#k2)">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <text x="300" y="306" font-family="Georgia, serif" font-size="12" fill="#8a1c1c" text-anchor="middle">diislid võtavad õhku paadi seest: rõhk langeb, kõrvad lähevad kinni</text>
  </g>
  <!-- rõhunäidik -->
  <circle cx="90" cy="250" r="34" fill="#f4ead2" stroke="#5a3f16" stroke-width="2"/>
  <text x="90" y="300" font-family="Georgia, serif" font-size="12" fill="#2b1d10" text-anchor="middle">siserõhk</text>
  <line x1="90" y1="250" x2="90" y2="222" stroke="#8a1c1c" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 90 250;0 90 250;-60 90 250;-60 90 250;0 90 250;0 90 250" keyTimes="0;0.38;0.45;0.6;0.68;1" dur="8s" repeatCount="indefinite"/>
  </line>
  <rect x="0" y="360" width="760" height="40" fill="#f4ead2"/>
  <!-- seisu tekst -->
  <g font-family="Georgia, serif" font-size="14" fill="#2b1d10">
    <text x="14" y="386"><tspan>1. Klapp lahti: välisõhk tuleb masti mööda diislitele.</tspan><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.35;0.4;0.6;0.65;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="14" y="386" opacity="0"><tspan>2. Laine lööb pea üle, klapp sulgub: diislid võtavad õhku paadi seest, siserõhk langeb.</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.4;0.6;0.65;1" dur="8s" repeatCount="indefinite"/></text>
  </g>
  <text x="560" y="26" font-family="Georgia, serif" font-size="12" fill="#5a3f16">Skeem: meisterwulf.com</text>
</svg>
