<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
  <title id="t">Kuidas mereveest saab magevesi</title>
  <desc id="d">Animatsioon, lihtsustatud põhimõtteskeem. Vasakul aurusti: elektriküttekeha ajab merevee keema, aur tõuseb üles. Aur liigub toru kaudu jahutisse, kus külma mereveega jahutatud torude pinnal muutub see uuesti veeks. Destillaat voolab soolsusmõõturist läbi kogumispaaki. Aurustisse jääv soolasem vesi lastakse välja. Merevesi ja soolvesi on sinised, aur ja magevesi rohelised.</desc>
  <rect width="760" height="420" fill="#f4ead2"/>
  <g font-family="Georgia, serif" fill="#2b1d10">
    <text x="20" y="28" font-size="16">Destilleerimise põhimõte: keeta, jahutada, kontrollida</text>
    <text x="20" y="48" font-size="12" fill="#5a3f16">Lihtsustatud skeem, mitte Widari torustik</text>
  </g>
  <!-- legend -->
  <g font-family="Georgia, serif" font-size="12" fill="#2b1d10">
    <rect x="520" y="16" width="16" height="12" fill="#6f9fc4" stroke="#1f4e79"/>
    <text x="542" y="27">merevesi ja soolvesi</text>
    <rect x="520" y="36" width="16" height="12" fill="#8cc08a" stroke="#2e6b2e"/>
    <text x="542" y="47">aur ja magevesi</text>
  </g>

  <!-- aurusti -->
  <rect x="60" y="120" width="170" height="190" rx="14" fill="#fbf6ea" stroke="#4a4a4a" stroke-width="3"/>
  <rect x="63" y="210" width="164" height="97" rx="10" fill="#6f9fc4"/>
  <path d="M85 280 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14" fill="none" stroke="#8a1c1c" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#e8f0f6">
    <circle cx="100" cy="262" r="4"><animate attributeName="cy" values="262;214" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="262" r="3"><animate attributeName="cy" values="262;214" dur="1.3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="262" r="4"><animate attributeName="cy" values="262;214" dur="1.7s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.7s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="262" r="3"><animate attributeName="cy" values="262;214" dur="1.5s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.5s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>
  <!-- aur aurustis -->
  <g fill="#8cc08a">
    <circle cx="110" cy="200" r="5"><animate attributeName="cy" values="205;130" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="200" r="5"><animate attributeName="cy" values="205;130" dur="2.2s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Georgia, serif" fill="#2b1d10" text-anchor="middle">
    <text x="68" y="112" font-size="14" text-anchor="start">1. aurusti</text>
    <text x="145" y="330" font-size="12" fill="#8a1c1c">elektriküttekeha</text>
    <text x="145" y="245" font-size="12" fill="#fff">merevesi keeb</text>
  </g>

  <!-- merevesi sisse -->
  <path d="M20 290 H60" stroke="#1f4e79" stroke-width="6"/>
  <path d="M60 290 l-10 -7 v14z" fill="#1f4e79"/>
  <text x="18" y="276" font-family="Georgia, serif" font-size="11" fill="#1f4e79">merevesi</text>
  <!-- soolvesi välja -->
  <path d="M200 310 V334 H300" fill="none" stroke="#1f4e79" stroke-width="6"/>
  <path d="M300 334 l-10 -7 v14z" fill="#1f4e79"/>
  <text x="212" y="356" font-family="Georgia, serif" font-size="12" fill="#1f4e79">soolasemaks jäänud vesi lastakse välja</text>

  <!-- aurutoru -->
  <path id="aurutee" d="M145 120 V78 H430 V112" fill="none" stroke="#7a7a7a" stroke-width="12" stroke-linejoin="round"/>
  <path d="M145 120 V78 H430 V112" fill="none" stroke="#fbf6ea" stroke-width="7" stroke-linejoin="round"/>
  <g fill="#2e6b2e">
    <circle r="4"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#aurutee"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3s" begin="1s" repeatCount="indefinite"><mpath href="#aurutee"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3s" begin="2s" repeatCount="indefinite"><mpath href="#aurutee"/></animateMotion></circle>
  </g>
  <text x="287" y="68" font-family="Georgia, serif" font-size="12" fill="#2e6b2e" text-anchor="middle">aur</text>

  <!-- jahuti -->
  <rect x="360" y="112" width="140" height="130" rx="12" fill="#fbf6ea" stroke="#4a4a4a" stroke-width="3"/>
  <g stroke="#1f4e79" stroke-width="7" stroke-linecap="round">
    <line x1="376" y1="140" x2="484" y2="140"/>
    <line x1="376" y1="165" x2="484" y2="165"/>
    <line x1="376" y1="190" x2="484" y2="190"/>
  </g>
  <path d="M500 140 H540" stroke="#1f4e79" stroke-width="5"/>
  <path d="M320 190 H360" stroke="#1f4e79" stroke-width="5"/>
  <path d="M360 190 l-9 -6 v12z" fill="#1f4e79"/>
  <path d="M540 140 l-9 -6 v12z" fill="#1f4e79"/>
  <text x="354" y="212" font-family="Georgia, serif" font-size="11" fill="#1f4e79" text-anchor="end">külm merevesi</text>
  <g fill="#2e6b2e">
    <ellipse cx="400" cy="150" rx="3" ry="4"><animate attributeName="cy" values="148;228" dur="1.4s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="440" cy="175" rx="3" ry="4"><animate attributeName="cy" values="173;228" dur="1.1s" begin="0.5s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="465" cy="200" rx="3" ry="4"><animate attributeName="cy" values="198;228" dur="0.9s" begin="0.2s" repeatCount="indefinite"/></ellipse>
  </g>
  <rect x="363" y="226" width="134" height="13" rx="6" fill="#8cc08a"/>
  <g font-family="Georgia, serif" fill="#2b1d10" text-anchor="middle">
    <text x="442" y="104" font-size="14" text-anchor="start">2. jahuti</text>
    <text x="422" y="280" font-size="12" fill="#2e6b2e" text-anchor="end">aur muutub jahedal torul veeks</text>
  </g>

  <!-- destillaat soolsusmõõturisse -->
  <path d="M430 242 V300 H540" fill="none" stroke="#2e6b2e" stroke-width="6"/>
  <!-- soolsusmõõtur -->
  <circle cx="580" cy="300" r="38" fill="#fbf6ea" stroke="#4a4a4a" stroke-width="3"/>
  <path d="M552 300 A28 28 0 0 1 580 272" fill="none" stroke="#2e6b2e" stroke-width="6"/>
  <path d="M580 272 A28 28 0 0 1 608 300" fill="none" stroke="#8a1c1c" stroke-width="6"/>
  <line x1="580" y1="300" x2="560" y2="282" stroke="#2b1d10" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="-8 580 300;6 580 300;-8 580 300" dur="4s" repeatCount="indefinite"/>
  </line>
  <circle cx="580" cy="300" r="4" fill="#2b1d10"/>
  <g font-family="Georgia, serif" fill="#2b1d10" text-anchor="middle">
    <text x="580" y="254" font-size="14">3. soolsusmõõtur</text>
    <text x="558" y="320" font-size="10" fill="#2e6b2e">puhas</text>
    <text x="603" y="320" font-size="10" fill="#8a1c1c">soolane</text>
  </g>
  <!-- kogumispaak -->
  <path d="M618 300 H660 V330" fill="none" stroke="#2e6b2e" stroke-width="6"/>
  <rect x="620" y="330" width="120" height="70" rx="6" fill="#fbf6ea" stroke="#4a4a4a" stroke-width="3"/>
  <rect x="623" y="380" width="114" height="17" fill="#8cc08a">
    <animate attributeName="y" values="390;345;345;390" keyTimes="0;0.8;0.95;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="height" values="7;52;52;7" keyTimes="0;0.8;0.95;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="680" y="414" font-family="Georgia, serif" font-size="12" fill="#2e6b2e" text-anchor="middle">4. magevesi</text>
  <g font-family="Georgia, serif" font-size="12" fill="#5a3f16">
    <text x="40" y="388">Sool ei aurustu: see jääb aurustisse. Kui mõõtur näitab soolasust,</text>
    <text x="40" y="404">ei lasta vett puhta vee paaki.</text>
  </g>
</svg>
