<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
  <title id="t">Schleichfahrt: miks võeti jalanõud jalast</title>
  <desc id="d">Vasakul kokkuvõte Saksa allveelaevaülema 1943. aasta käsiraamatu vaikse sõidu juhistest. Paremal skeem: masina värin ja sammud kanduvad kinnituste kaudu kerre ja sealt vette, kus vastase kuulamisseade võib neid tabada.</desc>
  <rect width="760" height="400" fill="#f4ead2"/>
  <rect x="16" y="16" width="300" height="368" rx="6" fill="#fbf5e6" stroke="#5a3f16"/>
  <g font-family="Georgia, serif" fill="#2b1d10">
    <text x="30" y="42" font-size="14">Allveelaevaülema käsiraamat,</text>
    <text x="30" y="60" font-size="14">1943, punkt 250: vaikne sõit</text>
    <line x1="30" y1="72" x2="300" y2="72" stroke="#5a3f16"/>
    <g font-size="13">
      <text x="30" y="96">• abimasinad seisma: pumbad,</text>
      <text x="42" y="113">ventilaatorid, kompressorid</text>
      <text x="30" y="136">• rool ja sügavustüürid käsitsi</text>
      <text x="30" y="159">• räägitakse tasa, töötatakse vaikselt</text>
      <text x="30" y="182">• liigutakse sukkis</text>
    </g>
    <g font-size="12" fill="#5a3f16">
      <text x="30" y="214">Samas punktis: kiirenda siis, kui vastane</text>
      <text x="30" y="230">kiirendab või pommid plahvatavad;</text>
      <text x="30" y="246">võimalusel pääse minema vastase</text>
      <text x="30" y="262">sõukruvi kiiluvees, sest see segab</text>
      <text x="30" y="278">tema kuulamist.</text>
      <text x="30" y="310">Jalanõud ei kaota sonarikaja:</text>
      <text x="30" y="326">need vähendavad hääli, mida vastase</text>
      <text x="30" y="342">kuulamisseade võib tabada.</text>
    </g>
    <text x="30" y="372" font-size="10" fill="#5a3f16">Kokkuvõte sõjaaegse ingliskeelse tõlke järgi (p 250).</text>
  </g>
  <!-- skeem -->
  <rect x="330" y="120" width="414" height="264" fill="#cfe0ee"/>
  <path d="M330 120 h414" stroke="#1f4e79" stroke-width="2"/>
  <path d="M350 250 q0 -60 70 -60 h200 q70 0 70 60 q0 60 -70 60 h-200 q-70 0 -70 -60z" fill="#8c8c8c" stroke="#4a4a4a" stroke-width="3"/>
  <path d="M364 250 q0 -48 58 -48 h196 q58 0 58 48 q0 48 -58 48 h-196 q-58 0 -58 -48z" fill="#e9e2cf"/>
  <rect x="410" y="248" width="60" height="32" fill="#6b6b6b"/>
  <rect x="404" y="280" width="72" height="8" fill="#4a4a4a"/>
  <text x="440" y="268" font-family="Georgia, serif" font-size="11" fill="#fff" text-anchor="middle">pump</text>
  <g stroke="#8a1c1c" stroke-width="2" fill="none">
    <path d="M440 288 l4 4 -8 4 8 4 -4 4">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- saabas ja sokk -->
  <path d="M560 276 h26 q8 0 8 8 v4 h-40z" fill="#5a3f16"/>
  <text x="575" y="270" font-family="Georgia, serif" font-size="11" fill="#2b1d10" text-anchor="middle">saabas</text>
  <path d="M606 280 h22 q8 0 8 8 v0 h-34z" fill="#d8cfb8" stroke="#8c8270"/>
  <text x="619" y="270" font-family="Georgia, serif" font-size="11" fill="#2b1d10" text-anchor="middle">sokk</text>
  <!-- värin kerest vette -->
  <g fill="none" stroke="#8a1c1c" stroke-width="2">
    <path d="M500 320 q10 8 20 0 q10 -8 20 0">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M492 340 q14 10 28 0 q14 -10 28 0 q14 10 28 0">
      <animate attributeName="opacity" values="0;0;1;0" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M484 360 q18 12 36 0 q18 -12 36 0 q18 12 36 0">
      <animate attributeName="opacity" values="0;0;0;1;0" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- jälituslaev ja kuulaja -->
  <path d="M600 120 l14 -14 h100 l14 14z" fill="#5a3f16"/>
  <circle cx="660" cy="136" r="7" fill="#2b1d10"/>
  <text x="600" y="96" font-family="Georgia, serif" font-size="12" fill="#2b1d10">vastase kuulamisseade</text>
  <g font-family="Georgia, serif" font-size="12" fill="#2b1d10">
    <text x="340" y="150">värin: masin → kinnitus → kere → vesi</text>
    <text x="340" y="170" fill="#5a3f16">samm saapaga kõlab kerre, sokis vaiksemalt</text>
  </g>
</svg>
