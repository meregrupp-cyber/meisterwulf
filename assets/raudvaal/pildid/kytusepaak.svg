<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
  <title id="t">Kütuse asemele tuli merevesi</title>
  <desc id="d">Animatsioon. Vasakul lihtsustatud kütusepaagi läbilõige: kütust võetakse ülevalt mootori poole, samal ajal voolab alt paaki merevesi ja võtab väheneva kütuse ruumi. Paremal skeem: sama diisel kas käitab sõukruvi või laeb akusid; laadimiseks kulunud kütus ei vii paati edasi.</desc>
  <rect width="760" height="380" fill="#f4ead2"/>
  <g font-family="Georgia, serif" fill="#2b1d10">
    <text x="20" y="28" font-size="15">1. Paak jääb täis: kütus ülal, merevesi all</text>
    <text x="440" y="28" font-size="15">2. Kuhu kütus läheb</text>
  </g>
  <!-- paak -->
  <rect x="60" y="60" width="260" height="220" rx="10" fill="#cfe0ee" stroke="#4a4a4a" stroke-width="3"/>
  <rect x="63" y="63" width="254" height="150" fill="#8a6a1c">
    <animate attributeName="height" values="150;30;30;150" keyTimes="0;0.7;0.9;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <line x1="63" y1="213" x2="317" y2="213" stroke="#1f4e79" stroke-width="2" stroke-dasharray="6 4">
    <animate attributeName="y1" values="213;93;93;213" keyTimes="0;0.7;0.9;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="213;93;93;213" keyTimes="0;0.7;0.9;1" dur="9s" repeatCount="indefinite"/>
  </line>
  <text x="190" y="120" font-family="Georgia, serif" font-size="14" fill="#fff" text-anchor="middle">kütus
    <animate attributeName="y" values="120;82;82;120" keyTimes="0;0.7;0.9;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="190" y="252" font-family="Georgia, serif" font-size="14" fill="#1f4e79" text-anchor="middle">merevesi</text>
  <!-- torud -->
  <path d="M300 60 V40 H400" fill="none" stroke="#4a4a4a" stroke-width="6"/>
  <path d="M400 40 l-12 -8 v16z" fill="#8a6a1c"/>
  <text x="330" y="32" font-family="Georgia, serif" font-size="12" fill="#2b1d10">mootori poole</text>
  <path d="M80 280 V310 H20" fill="none" stroke="#4a4a4a" stroke-width="6"/>
  <g fill="#1f4e79">
    <circle cx="30" cy="310" r="4"><animate attributeName="cx" values="22;80;80" keyTimes="0;0.5;1" dur="1.5s" repeatCount="indefinite"/><animate attributeName="cy" values="310;310;282" keyTimes="0;0.5;1" dur="1.5s" repeatCount="indefinite"/></circle>
  </g>
  <text x="20" y="334" font-family="Georgia, serif" font-size="12" fill="#2b1d10">merevesi tuleb alt peale</text>
  <g font-family="Georgia, serif" font-size="12" fill="#5a3f16">
    <text x="60" y="356">Kütus on veest kergem: kui vesi selle asemele tuleb, muutuvad</text>
    <text x="60" y="372">paadi kaal ja trimm ning neid tuleb arvestada.</text>
  </g>
  <!-- diisli töö -->
  <rect x="440" y="130" width="100" height="60" rx="6" fill="#6b6b6b"/>
  <text x="490" y="166" font-family="Georgia, serif" font-size="14" fill="#fff" text-anchor="middle">diisel</text>
  <path d="M540 150 H620" stroke="#2b1d10" stroke-width="2"/><path d="M620 150 l-10 -6 v12z" fill="#2b1d10"/>
  <path d="M540 172 C580 172 590 230 620 230" fill="none" stroke="#2b1d10" stroke-width="2"/><path d="M620 230 l-10 -6 v12z" fill="#2b1d10"/>
  <g font-family="Georgia, serif" font-size="13" fill="#2b1d10">
    <text x="628" y="146">sõukruvi:</text><text x="628" y="163" fill="#2e6b2e">meremiilid edasi</text>
    <text x="628" y="226">akude laadimine:</text><text x="628" y="243" fill="#8a1c1c">paat ei liigu</text><text x="628" y="260" fill="#8a1c1c">sama võrra edasi</text>
  </g>
  <g fill="#8a6a1c">
    <rect x="440" y="70" width="18" height="40" rx="3"/><rect x="462" y="80" width="18" height="30" rx="3"/><rect x="484" y="90" width="18" height="20" rx="3"/>
  </g>
  <text x="510" y="104" font-family="Georgia, serif" font-size="12" fill="#2b1d10">liitrid paagis</text>
  <g font-family="Georgia, serif" font-size="12" fill="#5a3f16">
    <text x="440" y="300">Seepärast arvestab Caspar kahte asja</text>
    <text x="440" y="316">eraldi: kui palju kütust on paagis</text>
    <text x="440" y="332">ja kui kaugele sellega tegelikult jõuab.</text>
  </g>
</svg>
