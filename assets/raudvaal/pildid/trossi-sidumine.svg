<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
  <title id="t">Miks tross enne lõikamist kinni seoti</title>
  <desc id="d">Kolm vaadet samast terastrossist: lõikekohal lahti hargnenud traadid; pehme traadiga tihedalt seotud koht mõlemal pool saeteed; läbi lõigatud otsad, mis püsivad koos.</desc>
  <defs>
    <pattern id="keerd" width="14" height="30" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)">
      <rect width="14" height="30" fill="#8d8a80"/>
      <rect width="7" height="30" fill="#b3afa3"/>
      <line x1="7" y1="0" x2="7" y2="30" stroke="#5c5a52" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="760" height="360" fill="#f4ead2"/>
  <g font-family="Georgia, serif" fill="#2b1d10">
    <text x="20" y="30" font-size="15">1. Seomata ots hargneb</text>
    <text x="270" y="30" font-size="15">2. Seotud mõlemal pool lõiget</text>
    <text x="530" y="30" font-size="15">3. Lõigatud, otsad koos</text>
  </g>
  <!-- 1: hargnenud -->
  <rect x="20" y="110" width="150" height="30" fill="url(#keerd)" stroke="#4a4840"/>
  <g stroke="#6e6b62" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M170 114 C190 100 205 80 220 64"/>
    <path d="M170 121 C195 118 215 108 232 96"/>
    <path d="M170 128 C195 132 218 136 236 142"/>
    <path d="M170 135 C190 150 205 168 214 186"/>
    <path d="M170 139 C182 160 186 180 186 200"/>
  </g>
  <g stroke="#3a3830" stroke-width="1.2" fill="none">
    <path d="M220 64 l6 -8 M220 64 l9 -2 M232 96 l8 -5 M236 142 l9 1 M214 186 l4 9 M186 200 l-2 9"/>
  </g>
  <text x="20" y="230" font-family="Georgia, serif" font-size="12" fill="#8a1c1c">keerud lähevad laiali,</text>
  <text x="20" y="246" font-family="Georgia, serif" font-size="12" fill="#8a1c1c">traadiotsad turritavad teravalt</text>
  <!-- 2: seotud -->
  <rect x="265" y="110" width="210" height="30" fill="url(#keerd)" stroke="#4a4840"/>
  <g fill="#caa56a" stroke="#6b4e1a" stroke-width=".8">
    <rect x="315" y="106" width="30" height="38" rx="2"/>
    <rect x="395" y="106" width="30" height="38" rx="2"/>
  </g>
  <g stroke="#6b4e1a" stroke-width="1">
    <line x1="318" y1="106" x2="318" y2="144"/><line x1="322" y1="106" x2="322" y2="144"/><line x1="326" y1="106" x2="326" y2="144"/><line x1="330" y1="106" x2="330" y2="144"/><line x1="334" y1="106" x2="334" y2="144"/><line x1="338" y1="106" x2="338" y2="144"/><line x1="342" y1="106" x2="342" y2="144"/>
    <line x1="398" y1="106" x2="398" y2="144"/><line x1="402" y1="106" x2="402" y2="144"/><line x1="406" y1="106" x2="406" y2="144"/><line x1="410" y1="106" x2="410" y2="144"/><line x1="414" y1="106" x2="414" y2="144"/><line x1="418" y1="106" x2="418" y2="144"/><line x1="422" y1="106" x2="422" y2="144"/>
  </g>
  <line x1="370" y1="90" x2="370" y2="160" stroke="#8a1c1c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="352" y="84" font-family="Georgia, serif" font-size="12" fill="#8a1c1c">saetee</text>
  <text x="290" y="182" font-family="Georgia, serif" font-size="12" fill="#6b4e1a">pehme sidumistraat tihedalt</text>
  <text x="290" y="198" font-family="Georgia, serif" font-size="12" fill="#6b4e1a">ümber jämedama kandetrossi</text>
  <!-- 3: lõigatud -->
  <rect x="520" y="110" width="80" height="30" fill="url(#keerd)" stroke="#4a4840"/>
  <rect x="640" y="110" width="80" height="30" fill="url(#keerd)" stroke="#4a4840"/>
  <g fill="#caa56a" stroke="#6b4e1a" stroke-width=".8"><rect x="570" y="106" width="30" height="38" rx="2"/><rect x="640" y="106" width="30" height="38" rx="2"/></g>
  <g stroke="#6b4e1a" stroke-width="1"><line x1="574" y1="106" x2="574" y2="144"/><line x1="580" y1="106" x2="580" y2="144"/><line x1="586" y1="106" x2="586" y2="144"/><line x1="592" y1="106" x2="592" y2="144"/><line x1="646" y1="106" x2="646" y2="144"/><line x1="652" y1="106" x2="652" y2="144"/><line x1="658" y1="106" x2="658" y2="144"/><line x1="664" y1="106" x2="664" y2="144"/></g>
  <g fill="#b3afa3" stroke="#4a4840" stroke-width=".8"><circle cx="604" cy="125" r="4"/><circle cx="636" cy="125" r="4"/></g>
  <text x="530" y="182" font-family="Georgia, serif" font-size="12" fill="#2e6b2e">otsad jäävad koos;</text>
  <text x="530" y="198" font-family="Georgia, serif" font-size="12" fill="#2e6b2e">traadid ei turrita</text>
  <!-- käsisaag -->
  <g transform="translate(335 250)">
    <rect x="0" y="16" width="120" height="6" fill="#8d8a80" stroke="#4a4840"/>
    <path d="M0 16 V0 H120 V16" fill="none" stroke="#5a3f16" stroke-width="4"/>
    <rect x="120" y="-4" width="28" height="14" rx="5" fill="#5a3f16"/>
    <text x="-10" y="48" font-family="Georgia, serif" font-size="12" fill="#2b1d10">väike käsirauasaag, nagu romaanis</text>
  </g>
  <text x="20" y="330" font-family="Georgia, serif" font-size="13" fill="#5a3f16">Inglise merendustermin: seizing. Side hoiab kimbud koos ja lõike puhtana, aga vana roostes trossi uuesti töökindlaks ei tee.</text>
  <text x="20" y="348" font-family="Georgia, serif" font-size="12" fill="#5a3f16">Joonis: meisterwulf.com, autori kirjelduse järgi.</text>
</svg>
