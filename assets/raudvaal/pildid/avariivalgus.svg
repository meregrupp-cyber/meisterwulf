<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d">
  <title id="t">Kui põhivalgus kustub</title>
  <desc id="d">Animatsioon. Vasakul traadist kaitsevõrega põhivalgusti ja väike avariilamp, millel on oma aku. Kui põhivalgustuse toide katkeb, lülitub avariilamp ise sisse, kuid annab nõrgemat valgust. Paremal sama ruum kolmes seisus: täies valguses, pimedas ja avariivalguses, kus näidikute järelhelendavad jaotised jäävad nähtavaks, kuid inimeste näod ja käed varju. Lihtsustatud joonis IXC tüüpi paatide 1946. aasta aruande järgi, mitte Widari foto.</desc>
  <defs>
    <radialGradient id="kuma" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="760" height="440" fill="#f4ead2"/>
  <g font-family="Georgia, serif" fill="#2b1d10">
    <text x="20" y="28" font-size="16">Põhivalgus ja avariilamp</text>
    <text x="20" y="48" font-size="12" fill="#5a3f16">Lihtsustatud joonis IXC tüüpi paatide 1946. aasta aruande järgi, mitte Widari foto</text>
  </g>

  <!-- 1. põhivalgusti -->
  <text x="30" y="84" font-family="Georgia, serif" font-size="13" fill="#2b1d10">1. Põhivalgusti</text>
  <rect x="60" y="94" width="80" height="10" fill="#6b6b6b"/>
  <circle cx="100" cy="134" r="24" fill="#fff3c4" stroke="#8a6a1c" stroke-width="2">
    <animate attributeName="fill" values="#fff3c4;#fff3c4;#7a7a7a;#7a7a7a;#fff3c4" keyTimes="0;0.3;0.32;0.95;1" dur="10s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#4a4a4a" stroke-width="2" fill="none">
    <path d="M72 104 Q60 134 80 160 M128 104 Q140 134 120 160 M100 104 V162 M80 160 H120"/>
    <path d="M66 124 H134 M68 144 H132"/>
  </g>
  <text x="30" y="186" font-family="Georgia, serif" font-size="11" fill="#5a3f16">traadist kaitsevõre</text>
  <text x="30" y="200" font-family="Georgia, serif" font-size="11" fill="#5a3f16">toide laeva võrgust</text>

  <!-- 2. avariilamp -->
  <text x="176" y="84" font-family="Georgia, serif" font-size="13" fill="#2b1d10">2. Avariilamp</text>
  <rect x="186" y="100" width="70" height="46" rx="4" fill="#8a8a8a" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="194" y="108" width="30" height="30" fill="#3a3a3a"/>
  <text x="209" y="128" font-family="Georgia, serif" font-size="9" fill="#e6e6e6" text-anchor="middle">aku</text>
  <circle cx="240" cy="123" r="11" fill="#7a7a7a" stroke="#4a4a4a" stroke-width="2">
    <animate attributeName="fill" values="#7a7a7a;#7a7a7a;#f2d27a;#f2d27a;#7a7a7a" keyTimes="0;0.36;0.38;0.95;1" dur="10s" repeatCount="indefinite"/>
  </circle>
  <text x="176" y="170" font-family="Georgia, serif" font-size="11" fill="#5a3f16">oma väike aku</text>
  <text x="176" y="184" font-family="Georgia, serif" font-size="11" fill="#5a3f16">süttib ise, kui toide kaob</text>
  <text x="176" y="198" font-family="Georgia, serif" font-size="11" fill="#5a3f16">valgus on nõrgem</text>

  <!-- olek -->
  <rect x="30" y="222" width="250" height="34" rx="6" fill="#efe2c4"/>
  <g font-family="Georgia, serif" font-size="13" text-anchor="middle">
    <text x="155" y="244" fill="#2e6b2e">põhivalgus põleb<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.31;0.95;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="155" y="244" fill="#8a1c1c" opacity="0">toide katkes: pime<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.31;0.32;0.37;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="155" y="244" fill="#8a6a1c" opacity="0">avariilamp põleb<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.37;0.38;0.95;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
  <g font-family="Georgia, serif" font-size="12" fill="#2b1d10">
    <text x="30" y="290">Aruande järgi said osa lampe voolu ka teisest</text>
    <text x="30" y="306">toiteharust. Kogu põhitoite kadumisel süttisid</text>
    <text x="30" y="322">avariilambid automaatselt.</text>
    <text x="30" y="350">Paljude mõõteriistade skaalad olid kaetud</text>
    <text x="30" y="366">järelhelendava ainega.</text>
    <text x="30" y="394">Eraldi punast üldvalgust uuritud paatidel ei olnud;</text>
    <text x="30" y="410">silmi harjutati pimedaga punaste prillidega.</text>
  </g>

  <!-- 3. ruum -->
  <text x="320" y="84" font-family="Georgia, serif" font-size="13" fill="#2b1d10">3. Sama ruum</text>
  <g>
    <rect x="320" y="94" width="420" height="320" fill="#d9cfb6"/>
    <!-- torud ja sein -->
    <rect x="320" y="94" width="420" height="16" fill="#9c9486"/>
    <rect x="330" y="120" width="170" height="170" rx="6" fill="#bdb49f" stroke="#7a7262" stroke-width="2"/>
    <!-- näidikud -->
    <g stroke="#4a4a4a" stroke-width="2" fill="#f7f1e2">
      <circle cx="372" cy="162" r="26"/><circle cx="458" cy="162" r="26"/><circle cx="415" cy="240" r="30"/>
    </g>
    <g stroke="#2b1d10" stroke-width="2.5" stroke-linecap="round">
      <line x1="372" y1="162" x2="386" y2="146"/><line x1="458" y1="162" x2="444" y2="148"/><line x1="415" y1="240" x2="432" y2="226"/>
    </g>
    <!-- läbikäik ja inimesed -->
    <rect x="530" y="120" width="110" height="294" fill="#c9bfa8"/>
    <path d="M560 414 V250 Q585 232 610 250 V414 Z" fill="#8a7a62"/>
    <circle cx="585" cy="226" r="18" fill="#c89a7a"/>
    <path d="M660 414 V290 Q690 272 720 290 V414 Z" fill="#7a6a54"/>
    <circle cx="690" cy="266" r="17" fill="#b88a6a"/>
    <rect x="626" y="310" width="36" height="14" rx="6" fill="#c89a7a"/>
    <!-- avariilambi koonus -->
    <rect x="520" y="112" width="30" height="16" rx="3" fill="#6b6b6b"/>
    <path d="M522 128 L470 330 H610 L548 128 Z" fill="url(#kuma)" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.37;0.38;0.95;1" dur="10s" repeatCount="indefinite"/>
    </path>
    <!-- pimedus -->
    <rect x="320" y="94" width="420" height="320" fill="#0b0f14" opacity="0">
      <animate attributeName="opacity" values="0;0;0.93;0.72;0.72;0" keyTimes="0;0.31;0.32;0.37;0.95;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <!-- helendavad jaotised -->
    <g fill="none" stroke="#9fe39a" stroke-width="3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.31;0.32;0.95;1" dur="10s" repeatCount="indefinite"/>
      <path d="M352 170 A22 22 0 0 1 392 150"/><path d="M438 170 A22 22 0 0 1 478 150"/><path d="M391 250 A26 26 0 0 1 440 226"/>
      <circle cx="386" cy="146" r="2.5" fill="#9fe39a"/><circle cx="444" cy="148" r="2.5" fill="#9fe39a"/><circle cx="432" cy="226" r="2.5" fill="#9fe39a"/>
    </g>
    <g fill="#f2d27a" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.37;0.38;0.95;1" dur="10s" repeatCount="indefinite"/>
      <rect x="520" y="112" width="30" height="16" rx="3"/>
    </g>
  </g>
  <rect x="320" y="94" width="420" height="320" fill="none" stroke="#4a4a4a" stroke-width="2"/>
  <g font-family="Georgia, serif" font-size="11" fill="#5a3f16">
    <text x="320" y="430">Avariivalguses on näidikud ja käigutee aimatavad, näod ja käed jäävad varju.</text>
  </g>
</svg>
