<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="t d">
  <title id="t">Miks võivad lained Aafrika lõunatipu lähedal järsemaks muutuda?</title>
  <desc id="d">Animatsioon. Lõuna-Aafrika lõunatipu kaart: Hea Lootuse neem, lõunapoolsem Agulhase neem ehk Nõelaneem ja Kaplinn. Jäme punane nool näitab Agulhase hoovuse üldsuunda piki idarannikut edelasse; edelast saabuvad lainefrondid liiguvad sellele vastu. Katkendliku ringiga on märgitud Widari asukoht romaani sündmustikus. All kaks lihtsustatud laineprofiili: tavaline lainejada ning vastuvoolus lühemaks ja järsemaks muutuv lainejada. Kaart on lihtsustatud ega ole navigeerimiseks.</desc>
  <defs>
    <marker id="nool" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a1c1c"/></marker>
    <marker id="nool2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker>
    <clipPath id="kaart"><rect x="20" y="52" width="560" height="295"/></clipPath>
    <clipPath id="p1"><rect x="24" y="392" width="338" height="96"/></clipPath>
    <clipPath id="p2"><rect x="398" y="392" width="338" height="96"/></clipPath>
  </defs>
  <rect width="760" height="520" fill="#f4ead2"/>
  <g font-family="Georgia, serif" fill="#2b1d10">
    <text x="20" y="30" font-size="16">Miks võivad lained Aafrika lõunatipu lähedal järsemaks muutuda?</text>
  </g>

  <!-- kaart -->
  <rect x="20" y="52" width="560" height="295" fill="#d9e4ea" stroke="#5a3f16" stroke-width="1"/>
