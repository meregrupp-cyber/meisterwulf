  <g font-family="Georgia, serif" font-size="12" fill="#2b1d10" stroke="#d9e4ea" stroke-width="3" paint-order="stroke" stroke-linejoin="round">
    <text x="95.5" y="161.3" fill="#5a3f16" font-size="11">Kaplinn</text>
    <text x="26" y="233.1">Hea Lootuse neem</text>
    <path d="M61.6,221.1 L88.6,195.1" stroke="#2b1d10" stroke-width="1"/>
    <text x="173.9" y="237.1">Agulhase neem</text>
    <text x="173.9" y="251.1" font-size="11" fill="#5a3f16">(Nõelaneem, Aafrika lõunatipp)</text>
    <text x="300" y="110" font-size="14" letter-spacing="2" fill="#5a3f16">LÕUNA-AAFRIKA</text>
    <text x="40" y="318" font-size="12" letter-spacing="2" fill="#1f4e79">ATLANDI OOKEAN</text>
    <text x="440" y="330" font-size="12" letter-spacing="2" fill="#1f4e79">INDIA OOKEAN</text>
    <text x="440" y="236" fill="#8a1c1c">Agulhase hoovus</text>
    <text x="440" y="250" font-size="11" fill="#8a1c1c">voolab edelasse</text>
    <text x="150" y="300" font-size="11" fill="#1f4e79" stroke="#d9e4ea" stroke-width="3" paint-order="stroke">lained edelast</text>
  </g>
  <!-- Widar -->
  <circle cx="129.4" cy="252.6" r="9" fill="none" stroke="#2e6b2e" stroke-width="1.6" stroke-dasharray="3 3"/>
  <circle cx="129.4" cy="252.6" r="2.5" fill="#2e6b2e"/>
  <text x="142.4" y="268.6" font-family="Georgia, serif" font-size="11" fill="#2e6b2e" stroke="#d9e4ea" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Widar (romaani sündmustik)</text>
  <!-- põhi -->
  <g font-family="Georgia, serif" font-size="11" fill="#2b1d10">
    <path d="M556,292 L562,272 L568,292 L562,287 z" fill="#2b1d10"/>
    <text x="558" y="306">P</text>
  </g>
  <g font-family="Georgia, serif" font-size="11" fill="#5a3f16">
    <text x="592" y="70">Kaart on lihtsustatud.</text>
    <text x="592" y="86">Hea Lootuse neem ei ole</text>
    <text x="592" y="100">Aafrika lõunapoolseim punkt:</text>
    <text x="592" y="114">selleks on Agulhase neem.</text>
    <text x="592" y="142">Kui lained liiguvad</text>
    <text x="592" y="156">hoovusele vastu, võivad</text>
    <text x="592" y="170">need muutuda lühemaks,</text>
    <text x="592" y="184">kõrgemaks ja järsemaks.</text>
    <text x="592" y="212">Kõrvalised hoovused ja</text>
    <text x="592" y="226">keerised teevad olukorra</text>
    <text x="592" y="240">keerulisemaks kui üks nool.</text>
    <text x="592" y="268">Widari asukoht on romaani</text>
    <text x="592" y="282">sündmustik, mitte 1945. aasta</text>
    <text x="592" y="296">ilmavaatluse tulemus.</text>
  </g>

  <!-- laineprofiilid -->
  <g font-family="Georgia, serif" font-size="13" fill="#2b1d10">
    <text x="24" y="380">1. Tavaline lainejada</text>
    <text x="398" y="380">2. Lained hoovusele vastu</text>
  </g>
