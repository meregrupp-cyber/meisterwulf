<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
  <title id="t">Mida näitas rasv loodi põhjas</title>
  <desc id="d">Vasakul käsilood: liinil on märgid, raskuse põhjas õõnsus, mis täidetakse rasvaga. Keskel läbilõige: rasva külge on jäänud liiv. Paremal kolm võimalikku tulemust: liiv, muda, kivikillud, ja kuidas sügavus koos põhja iseloomuga aitab kohta kaardilt otsida.</desc>
  <rect width="760" height="380" fill="#f4ead2"/>
  <g font-family="Georgia, serif" fill="#2b1d10">
    <text x="20" y="28" font-size="15">1. Käsilood</text>
    <text x="250" y="28" font-size="15">2. Põhi rasvas</text>
    <text x="500" y="28" font-size="15">3. Mida rasv tõi?</text>
  </g>
  <!-- 1: liin ja lood -->
  <line x1="110" y1="40" x2="110" y2="238" stroke="#8a6a1c" stroke-width="3"/>
  <g>
    <rect x="102" y="70" width="16" height="7" fill="#6b4e1a"/>
    <rect x="102" y="110" width="16" height="7" fill="#a33"/>
    <rect x="102" y="150" width="16" height="7" fill="#fff" stroke="#999" stroke-width=".6"/>
    <rect x="102" y="190" width="16" height="7" fill="#6b4e1a"/>
  </g>
  <g font-family="Georgia, serif" font-size="11" fill="#5a3f16">
    <text x="126" y="78">nahk</text><text x="126" y="118">punane riie</text><text x="126" y="158">valge riie</text>
    <text x="126" y="198">nahk</text>
  </g>
  <path d="M100 238 h20 l8 90 h-36 z" fill="#8c8c8c" stroke="#4a4a4a" stroke-width="1.5"/>
  <ellipse cx="110" cy="236" rx="8" ry="4" fill="none" stroke="#4a4a4a" stroke-width="2"/>
  <path d="M94 318 h32 v10 h-32 z" fill="#e9d98a" stroke="#8a7a2a"/>
  <text x="20" y="350" font-family="Georgia, serif" font-size="12" fill="#2b1d10">liinilt loeti sügavus,</text>
  <text x="20" y="366" font-family="Georgia, serif" font-size="12" fill="#2b1d10">märgid näitavad kaugust</text>
  <!-- 2: läbilõige -->
  <g transform="translate(330 60)">
    <path d="M-40 0 h80 l20 200 h-120 z" fill="#8c8c8c" stroke="#4a4a4a" stroke-width="2"/>
    <path d="M-40 150 h80 l5 50 h-90 z" fill="#f4ead2" stroke="#4a4a4a" stroke-width="1.5"/>
    <path d="M-40 160 h80 l4 40 h-88 z" fill="#e9d98a" stroke="#8a7a2a"/>
    <g fill="#b08a4a">
      <circle cx="-30" cy="196" r="3"/><circle cx="-18" cy="198" r="2.5"/><circle cx="-6" cy="195" r="3"/><circle cx="7" cy="198" r="2.5"/>
      <circle cx="19" cy="196" r="3"/><circle cx="31" cy="198" r="2.5"/><circle cx="-24" cy="191" r="2"/><circle cx="12" cy="192" r="2"/>
    </g>
    <text x="60" y="130" font-family="Georgia, serif" font-size="12" fill="#2b1d10">õõnsus põhjas</text>
    <text x="68" y="182" font-family="Georgia, serif" font-size="12" fill="#8a7a2a">rasv</text>
    <text x="68" y="206" font-family="Georgia, serif" font-size="12" fill="#8a1c1c">liivaterad</text>
    <path d="M58 126 L32 152" stroke="#2b1d10" fill="none"/>
    <path d="M66 178 L40 178" stroke="#8a7a2a" fill="none"/>
    <path d="M66 202 L40 197" stroke="#8a1c1c" fill="none"/>
  </g>
  <text x="250" y="300" font-family="Georgia, serif" font-size="12" fill="#2b1d10">põhja puudutamisel jääb</text>
  <text x="250" y="316" font-family="Georgia, serif" font-size="12" fill="#2b1d10">rasva külge proov põhjast</text>
  <!-- 3: tulemused -->
  <g font-family="Georgia, serif" font-size="12" fill="#2b1d10">
    <circle cx="530" cy="70" r="22" fill="#e9d98a" stroke="#8a7a2a"/>
    <g fill="#c8a45a"><circle cx="522" cy="64" r="3"/><circle cx="534" cy="72" r="3"/><circle cx="526" cy="80" r="2.5"/><circle cx="540" cy="62" r="2.5"/><circle cx="518" cy="76" r="2.5"/></g>
    <text x="566" y="66">liiv</text><text x="566" y="82" fill="#5a3f16" font-size="11">heledad terad</text>
    <circle cx="530" cy="130" r="22" fill="#6e5a3a" stroke="#4a3a20"/>
    <text x="566" y="126">muda</text><text x="566" y="142" fill="#5a3f16" font-size="11">tume, määrdunud pind</text>
    <circle cx="530" cy="190" r="22" fill="#e9d98a" stroke="#8a7a2a"/>
    <g fill="#777"><path d="M518 184 l6 -4 4 6z"/><path d="M532 194 l7 -3 1 7z"/><path d="M522 198 l5 -1 -1 5z"/></g>
    <text x="566" y="186">kivikillud</text><text x="566" y="202" fill="#5a3f16" font-size="11">või puhas rasv: kõva põhi</text>
  </g>
  <rect x="500" y="236" width="240" height="96" rx="6" fill="#fbf5e6" stroke="#5a3f16"/>
  <g font-family="Georgia, serif" font-size="12" fill="#2b1d10">
    <text x="512" y="258">sügavus liinilt</text>
    <text x="512" y="276">+ põhja iseloom rasvalt</text>
    <text x="512" y="298" fill="#1f4e79">→ võrdle kaardi ja sõidujuhistega:</text>
    <text x="512" y="316" fill="#1f4e79">kus on siin liiv, kus muda?</text>
  </g>
  <text x="740" y="366" font-family="Georgia, serif" font-size="11" fill="#5a3f16" text-anchor="end">Selgitav joonis; liini märgid on näitlikud.</text>
</svg>
