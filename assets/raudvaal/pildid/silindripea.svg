<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 400" width="810" height="400" role="img" aria-labelledby="t d">
  <title id="t">Miks vahetati ainult üks silindripea</title>
  <desc id="d">Läbilõige ühe silindri ülaosast: põlemiskamber, silindripeas kulgev jahutuskanal ja nende vahel pragu; kõrval üldvaade kuuesilindrilisest mootorist, kus üks pea on vahetatav.</desc>
  <defs>
    <pattern id="viir" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8a6a1c" stroke-width="1.2"/></pattern>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#2b1d10"/></marker>
  </defs>
  <rect width="810" height="400" fill="#f4ead2"/>
  <text x="20" y="30" font-family="Georgia, serif" font-size="17" fill="#2b1d10">Ühe silindri ülaosa läbilõige</text>
  <!-- silindriplokk (seinad) -->
  <rect x="60" y="200" width="40" height="150" fill="url(#viir)" stroke="#5a3f16" stroke-width="2"/>
  <rect x="320" y="200" width="40" height="150" fill="url(#viir)" stroke="#5a3f16" stroke-width="2"/>
  <!-- kolb -->
  <rect x="100" y="270" width="220" height="80" fill="#b59a5c" stroke="#5a3f16" stroke-width="2"/>
  <line x1="100" y1="288" x2="320" y2="288" stroke="#5a3f16" stroke-width="1.5"/><line x1="100" y1="300" x2="320" y2="300" stroke="#5a3f16" stroke-width="1.5"/>
  <text x="210" y="332" font-family="Georgia, serif" font-size="13" fill="#2b1d10" text-anchor="middle">kolb</text>
  <!-- põlemiskamber -->
  <rect x="100" y="200" width="220" height="70" fill="#e07a3a" opacity=".85"/>
  <text x="210" y="240" font-family="Georgia, serif" font-size="14" fill="#5a1a00" text-anchor="middle">põlemiskamber</text>
  <!-- tihend -->
  <rect x="60" y="194" width="300" height="6" fill="#2b1d10"/>
  <text x="372" y="200" font-family="Georgia, serif" font-size="12" fill="#2b1d10">tihend ploki ja pea vahel</text>
  <!-- silindripea -->
  <rect x="60" y="80" width="300" height="114" fill="#d9c393" stroke="#5a3f16" stroke-width="2.5"/>
  <text x="250" y="70" font-family="Georgia, serif" font-size="14" fill="#2b1d10">silindripea (eemaldatav)</text>
  <!-- jahutuskanalid peas -->
  <path d="M75 100 h70 v60 h-70z M275 100 h70 v60 h-70z M176 92 h68 v22 h-68z" fill="#7fb2d6" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="110" y="134" font-family="Georgia, serif" font-size="12" fill="#0f2f4d" text-anchor="middle">jahutus-</text>
  <text x="110" y="149" font-family="Georgia, serif" font-size="12" fill="#0f2f4d" text-anchor="middle">vesi</text>
  <text x="310" y="134" font-family="Georgia, serif" font-size="12" fill="#0f2f4d" text-anchor="middle">jahutus-</text>
  <text x="310" y="149" font-family="Georgia, serif" font-size="12" fill="#0f2f4d" text-anchor="middle">vesi</text>
  <!-- klapid ja pihusti -->
  <rect x="150" y="120" width="14" height="80" fill="#5a3f16"/><path d="M137 200 h40 l-6 8 h-28z" fill="#5a3f16"/>
  <rect x="256" y="120" width="14" height="80" fill="#5a3f16"/><path d="M243 200 h40 l-6 8 h-28z" fill="#5a3f16"/>
  <rect x="204" y="114" width="12" height="90" fill="#2b1d10"/><path d="M202 204 l8 10 8-10z" fill="#2b1d10"/>
  <text x="157" y="112" font-family="Georgia, serif" font-size="11" fill="#2b1d10" text-anchor="middle">klapp</text>
  <text x="263" y="112" font-family="Georgia, serif" font-size="11" fill="#2b1d10" text-anchor="middle">klapp</text>
  <text x="210" y="76" font-family="Georgia, serif" font-size="11" fill="#2b1d10" text-anchor="middle">pihusti</text>
  <!-- pragu jahutuskanalist põlemiskambrisse -->
  <path d="M300 160 l4 8 -5 7 6 9 -4 8 5 9" fill="none" stroke="#8a1c1c" stroke-width="3" stroke-linejoin="round"/>
  <line x1="378" y1="170" x2="312" y2="182" stroke="#8a1c1c" stroke-width="2" marker-end="url(#n)"/>
  <text x="372" y="132" font-family="Georgia, serif" font-size="13" fill="#8a1c1c">pragu: vesi pääseb</text>
  <text x="372" y="148" font-family="Georgia, serif" font-size="13" fill="#8a1c1c">jahutuskanalist</text>
  <text x="372" y="164" font-family="Georgia, serif" font-size="13" fill="#8a1c1c">silindrisse</text>
  <!-- üldvaade -->
  <text x="520" y="30" font-family="Georgia, serif" font-size="17" fill="#2b1d10">Üldvaade: kuus silindrit, kuus pead</text>
  <rect x="520" y="250" width="270" height="70" rx="6" fill="#b59a5c" stroke="#5a3f16" stroke-width="2"/>
  <text x="655" y="292" font-family="Georgia, serif" font-size="13" fill="#2b1d10" text-anchor="middle">väntvõlli karter</text>
  <g stroke="#5a3f16" stroke-width="2">
    <rect x="525" y="150" width="38" height="100" fill="#d9c393"/><rect x="569" y="150" width="38" height="100" fill="#d9c393"/><rect x="613" y="150" width="38" height="100" fill="#d9c393"/>
    <rect x="657" y="150" width="38" height="100" fill="#d9c393"/><rect x="701" y="150" width="38" height="100" fill="#d9c393"/><rect x="745" y="150" width="38" height="100" fill="#d9c393"/>
    <rect x="525" y="118" width="38" height="30" fill="#d9c393"/><rect x="569" y="118" width="38" height="30" fill="#d9c393"/><rect x="613" y="118" width="38" height="30" fill="#d9c393"/>
    <rect x="657" y="118" width="38" height="30" fill="#d9c393"/><rect x="701" y="118" width="38" height="30" fill="#d9c393"/>
  </g>
  <!-- vahetatav pea tõstetud -->
  <rect x="745" y="66" width="38" height="30" fill="#e8c97a" stroke="#8a1c1c" stroke-width="2.5"/>
  <line x1="764" y1="98" x2="764" y2="116" stroke="#8a1c1c" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="750" y="58" font-family="Georgia, serif" font-size="12" fill="#8a1c1c" text-anchor="middle">vahetatav pea</text>
  <text x="520" y="345" font-family="Georgia, serif" font-size="13" fill="#5a3f16">Igal silindril on oma eemaldatav pea: vigase saab</text>
  <text x="520" y="363" font-family="Georgia, serif" font-size="13" fill="#5a3f16">välja vahetada mootorit paadist välja tõstmata.</text>
  <text x="20" y="388" font-family="Georgia, serif" font-size="13" fill="#5a3f16">Selgitav skeem käsiraamatu kirjelduse järgi, mitte U-398 vigastuse ülesvõte. Joonis: meisterwulf.com.</text>
</svg>
