<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t d">
  <title id="t">Kaks päris saabumist ja romaani ankrukoht</title>
  <desc id="d">Lihtsustatud kaart Argentina rannikust Buenos Airesest Puerto Deseadoni. Mar del Platas on märgitud U-530 alistumine 10. juulil 1945 ja U-977 saabumine 17. augustil 1945. San Matíase lahes on märgitud hävitaja Mendoza sügavuspommid 18. juulil 1945, tabamust ei kinnitatud. Puerto Deseado juures on katkendliku joonega eraldi märgitud romaani väljamõeldud Widari ankrukoht augustis 1945.</desc>
  <rect width="760" height="460" fill="#f4ead2"/>
  <text x="20" y="28" font-family="Georgia, serif" font-size="16" fill="#2b1d10">Argentina rannik 1945: dokumenteeritud ja väljamõeldud</text>
  <rect x="24" y="44" width="344" height="374" fill="#cfe0ee"/>
  <polygon points="24.0,61.2 273.4,61.2 273.4,78.4 297.1,93.4 307.8,114.9 292.8,136.4 291.7,151.5 266.9,163.3 228.2,170.8 191.7,170.8 196.0,181.6 189.6,200.9 170.2,216.0 146.6,213.8 132.6,210.2 129.4,226.8 133.6,241.8 146.6,241.8 161.6,250.4 153.0,257.9 140.1,254.7 131.5,254.1 131.5,265.4 125.1,280.5 116.4,297.7 99.2,303.1 77.8,320.5 75.6,332.1 92.8,342.8 112.1,361.1 110.0,377.2 75.6,394.4 60.6,411.7 60.6,415.9 24.0,415.9" fill="#e3d6b4" stroke="#8a7a5a" stroke-width="1.5"/>
  <g font-family="Georgia, serif" font-size="11" fill="#5a3f16">
    <text x="195" y="82">Buenos Aires</text>
    <text x="86" y="316">Comodoro Rivadavia</text>
    <text x="160" y="241">San Matíase laht</text>
    <text x="40" y="150" font-size="13" fill="#8a7a5a">ARGENTINA</text>
    <text x="300" y="330" font-size="13" fill="#1f4e79">Atlandi ookean</text>
  </g>
  <circle cx="273.4" cy="78.4" r="3" fill="#5a3f16"/>
  <circle cx="77.8" cy="320.5" r="3" fill="#5a3f16"/>
  <!-- Mar del Plata -->
  <circle cx="291.7" cy="151.5" r="7" fill="#1f4e79" stroke="#fff" stroke-width="2"/>
  <text x="304" y="156" font-family="Georgia, serif" font-size="12" fill="#1f4e79">Mar del Plata</text>
  <!-- San Matías -->
  <circle cx="146.6" cy="228.9" r="6" fill="#8a1c1c" stroke="#fff" stroke-width="2"/>
  <!-- Puerto Deseado: romaan -->
  <circle cx="112.1" cy="361.1" r="9" fill="none" stroke="#2e6b2e" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="112.1" cy="361.1" r="3" fill="#2e6b2e"/>
  <text x="126" y="365" font-family="Georgia, serif" font-size="12" fill="#2e6b2e">Puerto Deseado</text>

  <g font-family="Georgia, serif" fill="#2b1d10">
    <text x="420" y="70" font-size="14" fill="#1f4e79">● Dokumenteeritud: Mar del Plata</text>
    <text x="440" y="92" font-size="12">U-530 alistus 10. juulil 1945.</text>
    <text x="440" y="110" font-size="12">U-977 saabus 17. augustil 1945.</text>
    <text x="440" y="128" font-size="12">Mõlema ülekuulamisaruanded on säilinud.</text>
    <text x="420" y="166" font-size="14" fill="#8a1c1c">● San Matíase laht, 18. juuli 1945</text>
    <text x="440" y="188" font-size="12">Hävitaja Mendoza teatas periskoobist</text>
    <text x="440" y="206" font-size="12">ja heitis sügavuspomme. Tabamust ega</text>
    <text x="440" y="224" font-size="12">aluse isikut ei kinnitatud.</text>
    <text x="440" y="242" font-size="12">21. juulil kästi rannapatrullid lõpetada.</text>
    <text x="420" y="280" font-size="14" fill="#2e6b2e">◌ Romaan: Puerto Deseado, august 1945</text>
    <text x="440" y="302" font-size="12">Widar on väljamõeldud paat. Tema ankrukoht</text>
    <text x="440" y="320" font-size="12">on loo sündmustik, mitte kolmas</text>
    <text x="440" y="338" font-size="12">dokumenteeritud saabumine.</text>
  </g>
  <text x="420" y="430" font-family="Georgia, serif" font-size="11" fill="#5a3f16">Lihtsustatud rannajoon; mõõtkava ligikaudne.</text>
</svg>
