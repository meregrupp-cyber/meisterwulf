<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
  <title id="t">Miks ballasti võtmine ei tähenda veel laeva uputamist</title>
  <desc id="d">Kaks lihtsat ristlõiget. Vasakul tavaline sukeldumine: vesi on ballastitankides survekere ümber, survekere sees on kuiv ja suruõhuga saab vee tankidest välja puhuda. Paremal uputamine: vesi pääseb survekere sisse ja paat ei saa enam ise tõusta.</desc>
  <rect width="760" height="360" fill="#f4ead2"/>
  <g font-family="Georgia, serif" fill="#2b1d10">
    <text x="30" y="30" font-size="15">1. Sukeldumine</text>
    <text x="410" y="30" font-size="15">2. Uputamine</text>
  </g>
  <!-- 1 -->
  <g transform="translate(190 170)">
    <ellipse cx="0" cy="0" rx="130" ry="110" fill="#6fa0c8" stroke="#4a4a4a" stroke-width="4"/>
    <circle cx="0" cy="0" r="78" fill="#e9e2cf" stroke="#2b1d10" stroke-width="6"/>
    <text x="0" y="5" font-family="Georgia, serif" font-size="13" fill="#2b1d10" text-anchor="middle">survekere kuiv</text>
    <text x="0" y="-92" font-family="Georgia, serif" font-size="12" fill="#fff" text-anchor="middle">vesi ballastitankides</text>
    <g fill="#fff">
      <circle cx="-100" cy="40" r="4"><animate attributeName="cy" values="60;-60" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="30" r="4"><animate attributeName="cy" values="60;-60" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <text x="190" y="310" font-family="Georgia, serif" font-size="12" fill="#2b1d10" text-anchor="middle">suruõhk puhub vee tankidest välja:</text>
  <text x="190" y="326" font-family="Georgia, serif" font-size="12" fill="#2b1d10" text-anchor="middle">paat saab uuesti pinnale</text>
  <!-- 2 -->
  <g transform="translate(570 170)">
    <ellipse cx="0" cy="0" rx="130" ry="110" fill="#6fa0c8" stroke="#4a4a4a" stroke-width="4"/>
    <circle cx="0" cy="0" r="78" fill="#e9e2cf" stroke="#2b1d10" stroke-width="6"/>
    <clipPath id="sees"><circle cx="0" cy="0" r="75"/></clipPath>
    <rect x="-78" y="78" width="156" height="200" fill="#6fa0c8" clip-path="url(#sees)">
      <animate attributeName="y" values="78;-30;-30;78" keyTimes="0;0.6;0.9;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="-45" font-family="Georgia, serif" font-size="13" fill="#2b1d10" text-anchor="middle">vesi survekeres</text>
  </g>
  <text x="570" y="310" font-family="Georgia, serif" font-size="12" fill="#8a1c1c" text-anchor="middle">klapid ja luugid lahti, laengud:</text>
  <text x="570" y="326" font-family="Georgia, serif" font-size="12" fill="#8a1c1c" text-anchor="middle">paat ei saa enam ise tõusta</text>
  <text x="20" y="352" font-family="Georgia, serif" font-size="11" fill="#5a3f16">Lihtsustatud ristlõige; laengute paigutust ja süüteseadmeid ei näidata.</text>
</svg>
