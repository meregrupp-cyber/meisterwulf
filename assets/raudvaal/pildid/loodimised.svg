<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d">
  <title id="t">Kaardi number ei kirjelda kogu merepõhja</title>
  <desc id="d">Ülal läbilõige: loodimised annavad sügavuse ainult mõõtepunktides, kahe punkti vahele jääb märkamata kivi. All animatsioon ülalt vaadates: kaks paati veavad enda vahel kindlal sügavusel traati, mis jääb kivi taha kinni. Paremal all traat ja kivi külgvaates ning ülesandelehe number 28, mille õige väärtus oli 8.</desc>
  <rect width="760" height="440" fill="#f4ead2"/>
  <g font-family="Georgia, serif" fill="#2b1d10">
    <text x="20" y="26" font-size="15">1. Loodimised: sügavus on teada ainult mõõdetud punktides</text>
    <text x="20" y="236" font-size="15">2. Traat kahe paadi vahel (vaade ülalt)</text>
  </g>
  <!-- ülemine läbilõige -->
  <rect x="20" y="60" width="720" height="140" fill="#cfe0ee"/>
  <path d="M20 60 h720" stroke="#1f4e79" stroke-width="2"/>
  <path d="M20 170 L60 168 L100 174 L150 176 L200 172 L240 172 L262 150 L278 106 L285 102 L292 108 L306 150 L330 180 L380 176 L420 172 L470 174 L510 168 L560 172 L600 166 L650 170 L690 172 L740 170 L740 200 L20 200 Z" fill="#b59a6a" stroke="#5a3f16" stroke-width="1.5"/>
  <g stroke="#2b1d10" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="60" y1="60" x2="60" y2="168"/><line x1="150" y1="60" x2="150" y2="176"/><line x1="240" y1="60" x2="240" y2="172"/>
    <line x1="330" y1="60" x2="330" y2="180"/><line x1="420" y1="60" x2="420" y2="172"/><line x1="510" y1="60" x2="510" y2="168"/>
    <line x1="600" y1="60" x2="600" y2="166"/><line x1="690" y1="60" x2="690" y2="172"/>
  </g>
  <g fill="#2b1d10"><circle cx="60" cy="168" r="3.5"/><circle cx="150" cy="176" r="3.5"/><circle cx="240" cy="172" r="3.5"/><circle cx="330" cy="180" r="3.5"/><circle cx="420" cy="172" r="3.5"/><circle cx="510" cy="168" r="3.5"/><circle cx="600" cy="166" r="3.5"/><circle cx="690" cy="172" r="3.5"/></g>
  <g font-family="Georgia, serif" font-size="13" fill="#1f4e79" text-anchor="middle">
    <text x="60" y="54">27</text><text x="150" y="54">29</text><text x="240" y="54">28</text><text x="330" y="54">30</text>
    <text x="420" y="54">28</text><text x="510" y="54">27</text><text x="600" y="54">26</text><text x="690" y="54">28</text>
  </g>
  <text x="285" y="92" font-family="Georgia, serif" font-size="12" fill="#8a1c1c" text-anchor="middle">kivi, tipp 8 m</text>
  <text x="285" y="78" font-family="Georgia, serif" font-size="12" fill="#8a1c1c" text-anchor="middle">mõõtmata</text>
  <text x="740" y="216" font-family="Georgia, serif" font-size="11" fill="#5a3f16" text-anchor="end">sinised arvud: kaardile kantud loodimised meetrites</text>
  <!-- alumine: vaade ülalt, animatsioon -->
  <rect x="20" y="246" width="460" height="176" fill="#cfe0ee"/>
  <g>
    <circle cx="330" cy="330" r="7" fill="#b59a6a" stroke="#5a3f16" stroke-width="1.5"/>
    <text x="330" y="354" font-family="Georgia, serif" font-size="11" fill="#5a3f16" text-anchor="middle">kivi</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-230 0; 0 0; 0 0" keyTimes="0; 0.62; 1" dur="8s" repeatCount="indefinite"/>
    <path d="M397 270 q-6 -8 -22 -8 h-16 v16 h16 q16 0 22 -8z" fill="#5a3f16"/>
    <path d="M397 392 q-6 -8 -22 -8 h-16 v16 h16 q16 0 22 -8z" fill="#5a3f16"/>
    <path d="M365 270 Q295 331 365 392" fill="none" stroke="#8a6a1c" stroke-width="2.5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.62;0.63;1" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.63;1" dur="8s" repeatCount="indefinite"/>
    <path d="M365 270 L333 325 M365 392 L333 335" fill="none" stroke="#8a1c1c" stroke-width="2.5"/>
    <circle cx="330" cy="330" r="13" fill="none" stroke="#8a1c1c" stroke-width="2"/>
    <text x="405" y="318" font-family="Georgia, serif" font-size="12" fill="#8a1c1c">traat pingul:</text>
    <text x="405" y="333" font-family="Georgia, serif" font-size="12" fill="#8a1c1c">siin on takistus</text>
  </g>
  <text x="30" y="414" font-family="Georgia, serif" font-size="11" fill="#5a3f16">paadid liiguvad paremale, traat ripub nende vahel kindlal sügavusel</text>
  <!-- külgvaade -->
  <text x="500" y="262" font-family="Georgia, serif" font-size="12" fill="#2b1d10">külgvaade</text>
  <rect x="500" y="270" width="240" height="70" fill="#cfe0ee"/>
  <path d="M500 270 h240" stroke="#1f4e79" stroke-width="1.5"/>
  <path d="M500 336 L580 334 L604 300 L612 296 L620 302 L640 334 L740 336 L740 340 L500 340 Z" fill="#b59a6a" stroke="#5a3f16"/>
  <line x1="500" y1="304" x2="740" y2="304" stroke="#8a6a1c" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="660" y="298" font-family="Georgia, serif" font-size="11" fill="#8a6a1c">traat 10 m</text>
  <text x="560" y="292" font-family="Georgia, serif" font-size="11" fill="#8a1c1c" text-anchor="end">kivi 8 m</text>
  <!-- 8 ja 28 -->
  <rect x="500" y="354" width="240" height="68" rx="6" fill="#fbf5e6" stroke="#5a3f16"/>
  <g font-family="Georgia, serif" fill="#2b1d10">
    <text x="512" y="374" font-size="12">Romaani ülesandeleht: teistsugune viga</text>
    <text x="512" y="398" font-size="15">ärakiri <tspan fill="#8a1c1c">28</tspan>  ·  õige <tspan fill="#2e6b2e">8</tspan></text>
    <text x="512" y="414" font-size="11" fill="#5a3f16">ümberkirjutamisviga, mitte mõõtmislünk</text>
  </g>
</svg>
