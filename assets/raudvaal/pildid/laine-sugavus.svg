<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
  <title id="t">Laine liikumine nõrgeneb sügavuses</title>
  <desc id="d">Animatsioon. Pinnalaine paneb veeosakesed liikuma ringjat rada mööda. Mida sügavamal, seda väiksemad on ringid: poole lainepikkuse sügavusel on liikumine alla viie protsendi pinnal olevast. Sügaval sõitev allveelaev kõigub seepärast vähem.</desc>
