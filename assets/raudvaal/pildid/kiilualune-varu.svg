<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d">
  <title id="t">Miks ei piisa ühest loodimisest?</title>
  <desc id="d">Animatsioon. Sama allveelaev sildumiskohas kõrgvee ja madalvee ajal. Merepõhi ja laeva süvis ei muutu; veepind langeb ja laev koos sellega. Vööri all on põhi sügavamal, ahtri all kõrgemal. Kiilu ja põhja vahe ehk kiilualune varu on kõige väiksem ahtri all madalvee ajal. Kaldal näitab tõusulatt veetaset kaardi nulltaseme suhtes. Arvud on selgitav näide, mitte Dingzi lahe mõõtmised.</desc>
  <rect width="760" height="470" fill="#f4ead2"/>
  <text x="20" y="30" font-family="Georgia, serif" font-size="16" fill="#2b1d10">Miks ei piisa ühest loodimisest?</text>
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a1c1c"/></marker>
    <clipPath id="vesi"><rect x="20" y="60" width="740" height="380"/></clipPath>
  </defs>
  <g clip-path="url(#vesi)">
    <!-- vesi (ülemine serv liigub) -->
    <rect x="20" y="150" width="740" height="300" fill="#cfdde6"><animate attributeName="y" values="150;150;202;202;150" keyTimes="0;0.15;0.5;0.65;1" dur="10s" repeatCount="indefinite"/></rect>
    <!-- kaardi nulltase -->
    <line x1="20" y1="206" x2="700" y2="206" stroke="#1f4e79" stroke-width="1" stroke-dasharray="6 5"/>
    <!-- laev liigub veepinnaga -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 52;0 52;0 0" keyTimes="0;0.15;0.5;0.65;1" dur="10s" repeatCount="indefinite"/>
      <path d="M112,144 C150,126 470,124 556,138 L566,146 C552,190 520,258 460,258 L220,258 C160,258 126,200 112,144 Z" fill="#4a4a4a" stroke="#2b1d10" stroke-width="1.2"/>
      <path d="M290,128 L298,86 L350,84 L366,126 Z M318,84 L318,64 L322,64 L322,84 Z" fill="#4a4a4a" stroke="#2b1d10" stroke-width="1.2"/>
      <line x1="118" y1="150" x2="560" y2="150" stroke="#f4ead2" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
    </g>
    <!-- põhi -->
    <path d="M20,372 L120,352 L215,346 L465,322 L560,300 L630,250 L690,205 L725,146 L760,134 L760,440 L20,440 Z" fill="#b89a6a" stroke="#5a3f16" stroke-width="1.2"/>
    <!-- kiilualune varu: joon kiilust põhjani -->
    <line x1="215" y1="258" x2="215" y2="346" stroke="#8a1c1c" stroke-width="2" marker-start="url(#o)" marker-end="url(#o)"><animate attributeName="y1" values="258;258;310;310;258" keyTimes="0;0.15;0.5;0.65;1" dur="10s" repeatCount="indefinite"/></line>
    <line x1="465" y1="258" x2="465" y2="322" stroke="#8a1c1c" stroke-width="2" marker-start="url(#o)" marker-end="url(#o)"><animate attributeName="y1" values="258;258;310;310;258" keyTimes="0;0.15;0.5;0.65;1" dur="10s" repeatCount="indefinite"/></line>
    <!-- tõusulatt -->
    <g font-family="Georgia, serif" font-size="10" fill="#2b1d10">
      <rect x="676" y="136" width="8" height="90" fill="#efe2c4" stroke="#5a3f16"/>
      <line x1="676" y1="206" x2="690" y2="206" stroke="#2b1d10"/><text x="693" y="210">0 m</text><line x1="676" y1="186" x2="690" y2="186" stroke="#2b1d10"/><text x="693" y="190">1 m</text><line x1="676" y1="166" x2="690" y2="166" stroke="#2b1d10"/><text x="693" y="170">2 m</text><line x1="676" y1="146" x2="690" y2="146" stroke="#2b1d10"/><text x="693" y="150">3 m</text>
    </g>
  </g>
  <!-- sildid -->
  <g font-family="Georgia, serif" font-size="12" fill="#2b1d10" stroke="#f4ead2" stroke-width="3" paint-order="stroke">
    <text x="24" y="144" fill="#1f4e79">veepind</text>
    <text x="24" y="220" fill="#1f4e79">kaardi nulltase</text>
    <text x="40" y="420">merepõhi: vööri all sügavam, ahtri all kõrgem</text>
    <text x="640" y="110">tõusulatt</text>
    <text x="150" y="80">vöör</text>
    <text x="500" y="80">ahter</text>
  </g>
  <g font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#8a1c1c" stroke="#cfdde6" stroke-width="3" paint-order="stroke">
    <g><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.3;0.32;0.82;0.84;1" dur="10s" repeatCount="indefinite"/><text x="223" y="305">4,4 m</text><text x="473" y="296">3,2 m</text><text x="600" y="78" fill="#1f4e79" stroke="#f4ead2">KÕRGVESI</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.32;0.82;0.84;1" dur="10s" repeatCount="indefinite"/><text x="223" y="336">1,8 m</text><text x="473" y="320">0,6 m</text><text x="600" y="78" fill="#8a1c1c" stroke="#f4ead2">MADALVESI</text></g>
  </g>
  <rect x="20" y="440" width="720" height="24" fill="#efe2c4"/>
  <text x="30" y="457" font-family="Georgia, serif" font-size="12" fill="#2b1d10">Süvis 5,4 m ei muutu. Otsustab vähim kiilualune varu: siin ahtri all madalvee ajal. Arvud on näide, mitte Dingzi lahe mõõtmised.</text>
</svg>
