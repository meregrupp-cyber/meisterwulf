<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t d">
  <title id="t">Miks ei saa allveelaeva lihtsalt välja lülitada?</title>
  <desc id="d">Animatsioon. Vasakul allveelaeva akuruumi lihtsustatud lõige: tekiplaatide all read pliiakuelemente, kohal õhukanal, mille kaudu laadimisel tekkinud gaas välja viiakse; elektrik kontrollib ühte elementi. Keskel suurendatud element: pruunid positiivsed ja hallid negatiivsed plaadid, elektrolüüdi tase, kork ja laadimisel tõusvad gaasimullid. Paremal võrdlus: seisev, kuid hooldatud aku, ning pikalt tühjana seisnud aku, mille plaatidel on valged pliisulfaadi kristallid ja mahutavus väiksem. Joonis selgitab põhimõtet, mitte Widari elektriskeemi.</desc>
